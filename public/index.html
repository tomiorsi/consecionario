<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manna Motors Selected — Automóviles seleccionados</title>
<meta name="description" content="Selección de automóviles deportivos. Cada unidad revisada, con historial verificado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Chivo+Mono:wght@300..600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   MERIDIANO — showroom

   La idea: el auto no es la página, es lo que está parado en el
   escenario. Quien manda es la luz.

   EL RIG. Seis capas de luz, todas dibujadas por CSS, ninguna es una
   foto. Se reparten por todo el cuadro para que la energía no quede
   amontonada abajo del auto:

     · horizonte  — la barra que cruza de lado a lado a la altura del
                    piso. Es la que hace que el auto se recorte contra
                    algo en vez de flotar en la nada.
     · reflejo    — la barra derramándose sobre el piso pulido
     · conos      — dos haces cenitales que caen desde arriba
     · brasa      — la mancha caliente justo abajo del auto
     · ambiente   — un lavado general que despega el negro del vacío

   Nada de esto se mueve cuando cambia el auto. Sólo late.

   EL AUTO. Va recortado con transparencia, encima del rig, y a poco
   más de la mitad de su tamaño natural (--car). Se escala desde la
   línea del piso, no desde el centro, para que las ruedas queden
   apoyadas donde está la barra de luz por más que cambie la escala.

   Sin color de acento. El acento es la luz — un blanco frío que es lo
   único que brilla en toda la página.
   ══════════════════════════════════════════════════════════════════ */

:root{
  /* ── EL ESTUDIO ──────────────────────────────────────────────────
     Los valores salen del video de la portada, no de una paleta
     inventada: es literalmente un ciclorama gris fotografiado, y el
     resto de la página tiene que vivir adentro de esa misma luz.

     Antes el escenario era un vacío NEGRO con haces de luz fría. El
     problema es que los autos están recortados de fotos de estudio
     CLARO: sobre el negro se leen pegoteados, como calcomanías. Por eso
     la segunda pantalla se sentía de otro sitio que la primera. */
  --cyc-hi:#D9DBDD;          /* alto del ciclorama */
  --cyc:#C2C5C8;             /* medio */
  --cyc-lo:#9B9EA2;          /* piso */

  /* El gris exacto del borde inferior del video, medido sobre el
     archivo. Es con lo que arranca el escenario para que el corte entre
     una pantalla y la otra caiga entre dos grises iguales y no se vea,
     sin necesidad de difuminar nada. */
  --seam:#9A9A9A;

  /* Los grises secundarios van más oscuros de lo que pedía el ojo sobre
     negro: acá el fondo es CLARO, y un gris medio sobre gris claro no
     llega al contraste mínimo para texto chico. */
  --ink:#101216;             /* tipografía principal */
  --ink-2:#3D4249;           /* secundaria */
  --ink-3:#666C74;           /* terciaria: unidades, notas */

  /* Único acento de toda la página, y sale de los assets: es el rojo de
     la óptica trasera del BMW, que aparece en el video y en las fotos.
     Se usa a escala de hilo — una línea de 2px, nunca un bloque. */
  --ember:#C8102E;

  --void:#000000;
  --chrome:#F2F4F8;
  --steel:#7E8593;
  --graphite:#454A55;
  --ghost:#141519;

  --beam:214,232,255;        /* el blanco frío del rig, en RGB */

  --display:"Archivo",-apple-system,system-ui,sans-serif;
  --mono:"Chivo Mono",ui-monospace,Menlo,monospace;

  /* Alto del escenario. Da aire arriba y abajo del auto en vez de
     dejarlo apretado contra los bordes de la ventana. */
  --stageh:min(114svh,60rem);

  /* LA PERILLA DEL RITMO DEL REEL. Es cuánto scroll ocupa la vuelta
     completa al auto: más alto = giro más lento y más control sobre
     cada tramo. Los 15,9 segundos de video se reparten en este alto,
     así que a 720svh cada pantalla de scroll son ~2,2 segundos.
     Es el único número a tocar si el giro se siente rápido o lento. */
  --reel-h:720svh;

  /* Relleno general. Se subió bastante: el sitio estaba pegado a los
     bordes y eso es lo que le sacaba aire premium. */
  --gut:clamp(1.6rem,4.4vw,4.5rem);

  /* Header: alto de la barra y las dos alturas del HUD (suelto sobre la
     portada / compacto una vez que se scrollea). */
  /* Más alta que antes: el desvanecido necesita recorrido. Si la barra
     mide lo justo, el degradado se apura y vuelve a leerse como un
     borde, que es lo que se quería evitar. */
  --bar-h:clamp(6rem,10.5vh,8.5rem);
  --hud-y:clamp(1.5rem,3.4vh,2.5rem);
  --hud-y-min:clamp(1.1rem,2.4vh,1.7rem);
  --ease:cubic-bezier(.22,1,.36,1);

  --ar:1672 / 941;           /* proporción nativa de las fotos */
  /* Dónde apoyan las ruedas DENTRO de la foto. Lo fija el script de
     recorte (GROUND en tools/build-cars.py) y no se toca desde acá:
     si cambia uno hay que cambiar el otro. */
  --img-ground:74%;
  --ground:74%;              /* altura de la línea del piso en la ventana */
  --car:.60;                 /* escala del auto — la recalcula el JS */
  --carw:50vw;               /* ancho real del auto en pantalla — ídem */

  /* Ancho del pedestal de luz. Se mide contra el auto, no contra la
     ventana: la barra tiene que terminar poco después que el auto para
     que se lea como una tarima donde está parado, y no como un
     horizonte que cruza la pantalla. Es lo que lo deja flotando. */
  --barw:calc(var(--carw) * 1.14);
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{height:100%}

/* Barra de scroll oculta, misma técnica que en PRUEBAS/auto.
   Se OCULTA, no se le da estilo: darle estilo a ::-webkit-scrollbar en
   macOS convierte las barras flotantes en permanentes y queda una
   franja fija sobre el negro. El scroll sigue funcionando igual
   (rueda, trackpad, teclado, dedo); sólo desaparece el indicador. */
html{
  scrollbar-width:none;        /* Firefox */
  -ms-overflow-style:none;     /* Edge viejo */
}
html::-webkit-scrollbar{       /* Chrome, Safari */
  display:none;
}
body{
  /* El fondo de la página es el estudio, no el vacío negro: si el body
     queda negro, cualquier rebote del scroll o un instante antes de que
     pinte el video muestra un flash oscuro entre dos pantallas claras. */
  background:#000;
  color:var(--chrome);
  font-family:var(--display);
  /* Antes era overflow:hidden — la página era una sola pantalla fija.
     Ahora hay dos: la portada en video y, debajo, el escenario del auto.
     Se permite el scroll vertical y se corta el horizontal, que nunca
     hizo falta y sólo puede aparecer por desbordes del marco. */
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-font-smoothing:antialiased;
}

/* ══════════════════════════════════════════════════════════════════
   PORTADA EN VIDEO — primera pantalla
   ══════════════════════════════════════════════════════════════════

   Ocupa la ventana entera. Se usa 100svh y no 100vh porque en el
   teléfono la barra del navegador se come el 100vh y la portada
   quedaría más alta que la pantalla, dejando un salto al scrollear.

   Hay DOS videos distintos, no uno recortado: el de computadora es
   16:9 (1920x1080) y el de teléfono es vertical 9:16 (720x1278),
   filmado aparte para esa pantalla.

   Como cada archivo ya viene con la orientación de su pantalla, los
   dos van COVER: llenan la ventana y recortan muy poco.

   Único caso raro: una ventana de escritorio muy angosta y alta
   recibiría igual el archivo horizontal (la elección va por
   screen.width, ver el script) y el cover recortaría de más. Es un
   formato que en la práctica no usa nadie. */

#cover{
  position:relative;
  width:100%;
  height:100svh;
  overflow:hidden;
  background:var(--void);
  z-index:2;
}

#cover video{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

/* EL APAGADO A NEGRO.

   No es un velo fijo —eso ensuciaba el video y se sacó—: es una capa
   negra que arranca invisible y se va encendiendo A MEDIDA QUE SE
   SCROLLEA. Arriba de todo el video se ve intacto; cuando la portada
   está por irse, ya es negro puro, y abajo lo que sigue también es
   negro. Por eso no hay corte entre una sección y la otra: no hay dos
   colores que empalmar, el gris se convirtió en negro en el camino.

   La opacidad la escribe el JS en --fade (0 a 1) desde el listener de
   scroll. Va sobre TODO el contenido de la portada, texto incluido:
   se apaga la escena entera, no el fondo por un lado y las letras por
   otro. */
#cover::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
  background:#000;
  opacity:var(--fade,0);
}

/* ══════════════════════════════════════════════════════════════════
   LA FRANJA — la frase entre la portada y el reel
   ══════════════════════════════════════════════════════════════════

   Negro pleno y mucho aire: es una pausa, no una sección con
   contenido. Después del apagado de la portada el ojo llega a un
   silencio, lee dos líneas y recién ahí empieza la vuelta al auto.

   El texto entra con un fundido cuando la franja aparece en pantalla.
   Se dispara con IntersectionObserver y no con el scroll: así el
   navegador avisa cuando corresponde en vez de que estemos midiendo
   posiciones en cada píxel. */
#band{
  position:relative;
  background:#000;
  /* La mitad de lo que era: es una pausa, no una sección. */
  min-height:min(42svh,24rem);
  display:grid;
  place-items:center;
  padding:clamp(3rem,9vh,6rem) var(--gut);
  text-align:center;
}

/* EL EFECTO — entrar en foco.

   Las dos líneas llegan desenfocadas y separadas, y se van enfocando y
   juntando a medida que la franja se acerca al centro de la pantalla.
   Al salir, vuelven a desenfocarse.

   No es decoración: el negocio es SELECCIONAR y VERIFICAR autos, o sea
   poner algo en foco. El efecto dice lo mismo que el texto.

   Lo maneja --p (de 0 a 1), que escribe el JS desde el scroll: 0 es
   lejos del centro, 1 es centrado. El valor por defecto es 1 a
   propósito — si el JS no corriera, el texto queda nítido y legible en
   vez de desaparecer desenfocado. */
.band-copy{
  --p:1;
  max-width:52rem;
}

.band-copy p{
  color:var(--chrome);
  font-size:clamp(1.5rem,3.4vw,2.9rem);
  font-variation-settings:"wdth" 92,"wght" 500;
  letter-spacing:-.02em;
  line-height:1.24;

  filter:blur(calc((1 - var(--p)) * 11px));
  opacity:calc(.12 + var(--p) * .88);
  will-change:filter,transform,opacity;
}

/* Las dos líneas convergen: la de arriba viene de la izquierda y la de
   abajo de la derecha. Cuando el texto está enfocado, las dos están en
   su lugar. */
.band-copy p:first-child{
  transform:translateX(calc((1 - var(--p)) * -3.4rem));
}

/* La segunda línea baja de peso y de tamaño: es el eco de la primera,
   no una frase aparte. */
.band-copy p + p{
  margin-top:clamp(.5rem,1.4vh,.9rem);
  font-size:clamp(1.15rem,2.5vw,2.05rem);
  font-variation-settings:"wdth" 92,"wght" 400;
  color:var(--steel);
  transform:translateX(calc((1 - var(--p)) * 3.4rem));
}

@media (prefers-reduced-motion:reduce){
  .band-copy p{ filter:none; transform:none; opacity:1; }
}

/* ── el texto de la portada ────────────────────────────────────────

   Poco y abajo a la izquierda: el video ya es el argumento, el texto
   sólo dice de qué se trata. Va sobre el gris claro del estudio, así
   que la tinta es oscura — un texto blanco ahí se perdería.

   El bloque respira contra el borde con el mismo --gut que todo lo
   demás, y se aparta del centro para no taparle los autos. */
.cover-copy{
  position:absolute;
  /* A la derecha: es el lado despejado del cuadro. El sedán ocupa toda
     la mitad izquierda y el texto le caía encima. */
  right:var(--gut);
  bottom:calc(var(--gut) + clamp(2.2rem,5vh,3.6rem));
  z-index:4;
  max-width:min(30rem,74vw);
  text-align:right;
  color:var(--ink);
}

.cover-eyebrow{
  font-family:var(--mono);
  font-size:.6rem;
  font-weight:400;
  letter-spacing:.42em;
  text-transform:uppercase;
  color:var(--ink-2);
  margin-bottom:clamp(.9rem,2vh,1.4rem);
  /* el hilo rojo del BMW, otra vez a un pixel */
  padding-right:2.1rem;
  position:relative;
}
.cover-eyebrow::before{
  content:"";
  position:absolute;
  right:0; top:50%;
  width:1.4rem; height:1px;
  background:var(--ember);
}

.cover-title{
  font-size:clamp(2.1rem,5.1vw,3.9rem);
  font-variation-settings:"wdth" 88,"wght" 560;
  letter-spacing:-.028em;
  line-height:1.02;
  margin-bottom:clamp(.8rem,1.8vh,1.2rem);
}

.cover-sub{
  font-family:var(--mono);
  font-size:clamp(.68rem,1.05vw,.8rem);
  font-weight:300;
  letter-spacing:.04em;
  line-height:1.6;
  color:var(--ink-2);
  max-width:26rem;
  margin-left:auto;
}

/* Señal de que abajo sigue habiendo página. Sin esto la portada se lee
   como el final del sitio y el escenario del auto no lo encuentra nadie. */
#cover .scroll-cue{
  position:absolute;
  left:50%;
  bottom:calc(var(--gut) + 4px);
  transform:translateX(-50%);
  z-index:3;
  display:block;
  width:22px;
  height:22px;
  color:var(--ink);
  opacity:.42;
  animation:cue 2.4s ease-in-out infinite;
}

@keyframes cue{
  0%,100%{ transform:translate(-50%,0); opacity:.35 }
  50%    { transform:translate(-50%,6px); opacity:.7 }
}

#stage{
  /* Era position:fixed + inset:0, porque el sitio era una única
     pantalla. Ahora es la SEGUNDA: pasa a ser un bloque normal de una
     ventana de alto, debajo de la portada.

     Todo lo que vive adentro (#rig, #frame, el HUD, las cifras y las
     flechas) es position:absolute, así que sigue posicionándose contra
     #stage exactamente igual que antes. No hay que tocar nada de eso. */
  position:relative;
  width:100%;
  /* --stageh y no 100svh suelto: el alto del escenario y el del marco
     TIENEN que salir de la misma variable. Si divergen, la línea del
     piso del rig y la línea donde apoyan las ruedas caen en lugares
     distintos y el auto queda flotando o hundido. */
  height:var(--stageh);
  overflow:hidden;
  background:#000;
  /* Era touch-action:none, que en el teléfono mata el scroll vertical:
     al llegar al escenario ya no se podía volver a la portada.
     Con pan-y el dedo scrollea en vertical y el swipe horizontal de los
     autos —que va por pointerdown— sigue funcionando igual. */
  touch-action:pan-y;
}

/* ── marco: sólo el auto vive acá ──────────────────────────────── */

/* Va SIEMPRE atado al alto de la ventana, nunca al ancho. Ése es el
   truco que mantiene la línea del piso en el mismo lugar de la
   pantalla en cualquier formato: si el alto del marco es 100vh, el
   piso cae en var(--ground) de la ventana, y el rig —que ocupa la
   ventana entera— puede dibujar su barra justo ahí.

   A lo ancho el marco se desborda, y no importa: lo único que hay
   adentro es el auto, que se achica con --car hasta entrar. */
#frame{
  position:absolute;
  top:0; left:50%;
  transform:translateX(-50%);
  /* Mismo unidad que #stage (100svh), no 100vh: si el marco midiera
     100vh y el escenario 100svh, en el teléfono el marco sería más alto
     que el escenario y la línea del piso caería por debajo de la barra
     del rig, que sí mide lo que el escenario. Los dos tienen que ir
     siempre atados a la misma unidad. */
  height:var(--stageh);
  width:calc(var(--stageh) * var(--ar));
  z-index:3;
}

/* ══════════════════════════════════════════════════════════════════
   EL RIG DE LUCES
   ══════════════════════════════════════════════════════════════════ */

#rig{ position:absolute; inset:0; z-index:1; }
#rig > *{ position:absolute; pointer-events:none; }

/* EL CICLORAMA. Un ciclorama de verdad no tiene línea de horizonte: la
   pared baja y se curva hasta volverse piso, sin junta. Eso es lo que
   se dibuja acá — la pared clara arriba, el piso más apagado abajo, y
   entre medio una transición larga.

   Encima va una luz cenital suave, centrada donde va a estar el auto:
   es la que hace que el auto se recorte contra un fondo que no es
   plano. Sin ella el gris se lee como una pared pintada. */
/* EL ESTUDIO OSCURO. Mismo lenguaje que las fotos del RS3 que están
   justo arriba en el reel: negro, y un charco de luz fría sobre el piso
   donde está parado el auto. La pared no se ilumina — lo único que
   existe es el piso y lo que se apoya en él. */
.l-ambient{
  inset:0;
  background:
    /* el charco de luz del piso, centrado en la línea de apoyo */
    radial-gradient(58% 26% at 50% var(--ground), rgba(var(--beam),.20), transparent 72%),
    /* un lavado altísimo, apenas suficiente para que el negro de arriba
       no se lea como un agujero plano */
    radial-gradient(86% 52% at 50% 16%, rgba(var(--beam),.045), transparent 74%),
    #000;
}

/* Los dos haces cenitales se retiran.

   Eran el recurso más teatral del escenario y son justamente lo que
   peleaba con las fotos: los autos vienen de un estudio de luz difusa,
   sin haces marcados, así que dos conos duros encima los delataban como
   recortes. El JS les sigue animando la opacidad y no pasa nada.

   (La regla de Chanel: antes de salir, sacate un accesorio.) */
.l-cone{ display:none; }


/* LA TARIMA. Todo lo que pasa a la altura del piso vive acá adentro y
   mide --barw, no el ancho de la ventana: la luz termina poco después
   que el auto y el conjunto queda flotando en el medio del negro. */
.l-stage{
  left:50%; top:var(--ground);
  width:var(--barw);
  transform:translateX(-50%);
}
.l-stage > *{ position:absolute; }

/* La barra de luz también se retira: en un ciclorama no hay junta. Lo
   único que queda a la altura del piso es un apoyo apenas insinuado,
   para que el auto no flote. */
/* Sin barra: el auto se apoya sobre el charco de luz, no sobre una
   línea. Queda apenas el filo donde el piso empieza a recibirla. */
.l-horizon{
  left:-15%; right:-15%; top:0;
  height:1px;
  background:linear-gradient(90deg,
    transparent, rgba(var(--beam),.10) 30%, rgba(var(--beam),.16) 50%,
    rgba(var(--beam),.10) 70%, transparent);
}

.l-sweep{ display:none; }

/* El piso devolviendo la luz cenital: un barrido claro que sale de la
   línea de apoyo hacia abajo. Es sutil a propósito — un piso de
   estudio no espeja, apenas satina. */
.l-reflect{
  left:0; right:0; top:0;
  height:clamp(5rem,17vh,13rem);
  background:linear-gradient(180deg, rgba(var(--beam),.14), transparent 64%);
  -webkit-mask-image:linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent);
          mask-image:linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent);
}

/* LA FIRMA — la sombra de contacto.

   Es el detalle que separa una foto de producto de un recorte pegado:
   la mancha oscura, corta y difusa que el auto proyecta justo debajo,
   más densa bajo las ruedas que en el medio. Reemplaza a la "brasa"
   —que era luz saliendo del piso, físicamente al revés— y es lo único
   que ancla el auto al suelo ahora que no hay barra. */
.l-ember{
  left:50%; top:0;
  width:86%; height:clamp(1.8rem,5.2vh,4.2rem);
  transform:translate(-50%,-42%);
  /* Sobre negro una sombra no se ve: lo que ancla el auto es la luz que
     el piso devuelve alrededor de las ruedas. Mismo dibujo que el
     contacto —más densa en los extremos, donde apoya— pero en positivo. */
  background:
    radial-gradient(ellipse 44% 60% at 17% 50%, rgba(var(--beam),.34), transparent 74%),
    radial-gradient(ellipse 44% 60% at 83% 50%, rgba(var(--beam),.34), transparent 74%),
    radial-gradient(ellipse 56% 44% at 50% 50%, rgba(var(--beam),.16), transparent 78%);
  filter:blur(13px);
}

/* ── el nombre gigante, atrás de todo ──────────────────────────── */

#word{
  position:absolute;
  z-index:2;
  left:50%;
  /* colgado de la línea del piso, no de un % suelto: así queda detrás
     del auto en cualquier formato de pantalla. La resta lo sube justo
     lo necesario para que asome por encima del techo. */
  top:calc(var(--ground) - clamp(9rem,30vh,20rem));
  transform:translate(-50%,-50%);
  font-size:clamp(2.6rem,11vw,9rem);
  font-variation-settings:"wdth" 66,"wght" 800;
  letter-spacing:-.025em;
  line-height:.8;
  white-space:nowrap;
  /* Sobre el ciclorama claro el nombre no puede ser casi negro: pasaba
     a competir con el auto. Va como una marca de agua apenas más oscura
     que la pared — se lee si la buscás, no si mirás el auto. */
  color:#141519;
  pointer-events:none;
  user-select:none;
  will-change:transform,opacity;
}

/* ── el auto ───────────────────────────────────────────────────── */

/* Dos movimientos distintos, y hay que no mezclarlos:

   · La ESCALA se hace desde donde apoyan las ruedas en la foto
     (--img-ground). Así el auto se achica sin despegarse del piso.
   · El DESPLAZAMIENTO lleva ese piso hasta donde está la barra de luz
     (--ground). En horizontal los dos valores coinciden y no se mueve
     nada; en vertical el auto sube para dejar lugar abajo.

   Cuando escalaba desde --ground en vez de --img-ground, achicar el
   auto le corría las ruedas hacia abajo y la barra quedaba por encima
   de la rueda. */
#deck{
  position:absolute; inset:0;
  transform:translateY(calc(var(--ground) - var(--img-ground))) scale(var(--car));
  transform-origin:50% var(--img-ground);
}

.car{
  position:absolute;
  inset:0;
  width:100%; height:100%;
  object-fit:fill;          /* el marco ya tiene la proporción exacta */
  opacity:0;
  pointer-events:none;
  will-change:transform,opacity,filter;
}
.car.is-on{ opacity:1; }

/* ══════════════════════════════════════════════════════════════════
   INTERFAZ
   ══════════════════════════════════════════════════════════════════ */

/* FIXED, no absolute. La marca y el menú tienen que estar desde el
   primer momento, sobre la portada: es la página principal, no una
   pantalla de transición. Al ser fixed se anclan a la ventana y
   acompañan las dos pantallas.

   Funciona porque #stage no tiene transform, filter ni will-change: si
   los tuviera, pasaría a ser el bloque contenedor del fixed y el HUD
   quedaría encerrado adentro del escenario (y recortado por su
   overflow:hidden). Si alguna vez se le agrega una de esas
   propiedades, hay que sacar el HUD de #stage en el HTML. */
.hud{ position:fixed; z-index:60; }
.hud--tl{ top:var(--hud-y); left:var(--gut); }
.hud--tr{ top:var(--hud-y); right:var(--gut); }

/* LA BARRA DEL HEADER.

   El pedido era que la marca y el menú se vean en TODA la página. Con
   position:fixed ya se veían, pero flotaban sueltos sobre lo que
   hubiera detrás y en la portada quedaban compitiendo con el video.

   Ahora hay dos estados. Arriba de todo la barra es invisible y las
   piezas flotan sobre el video, que es lo que corresponde a una
   portada. Apenas se scrollea aparece un vidrio esmerilado con una
   línea de un pixel: el header se separa del contenido sin taparlo.

   El fondo se difumina con backdrop-filter en vez de pintarse opaco,
   así el auto sigue viéndose por detrás cuando pasa. */
#topbar{
  position:fixed;
  top:0; left:0; right:0;
  height:var(--bar-h);
  z-index:55;
  pointer-events:none;
  background:linear-gradient(180deg, rgba(217,219,221,0), rgba(217,219,221,0));
  backdrop-filter:blur(0px);
  -webkit-backdrop-filter:blur(0px);

  /* SIN LÍNEA, SE DESVANECE.

     Antes la barra terminaba en un borde de 1px. Ahora no termina: se
     apaga. La máscara en degradado es la pieza clave, y tiene que ir
     acá y no en el background, porque enmascara TODO el elemento —el
     color de fondo Y el desenfoque del backdrop-filter juntos.

     Si sólo se difuminara el color, el corte del desenfoque seguiría
     dibujando una línea nítida donde termina la barra: se vería
     exactamente lo que queremos sacar. */
  -webkit-mask-image:linear-gradient(180deg, #000 42%, rgba(0,0,0,.55) 74%, transparent 100%);
          mask-image:linear-gradient(180deg, #000 42%, rgba(0,0,0,.55) 74%, transparent 100%);

  transition:background .45s var(--ease),
             backdrop-filter .45s var(--ease), -webkit-backdrop-filter .45s var(--ease);
}

body.is-scrolled #topbar{
  /* el fondo también se abre hacia abajo, para que el desvanecido
     arranque antes de que termine la máscara */
  background:linear-gradient(180deg, rgba(217,219,221,.80), rgba(217,219,221,.38));
  backdrop-filter:blur(16px) saturate(1.15);
  -webkit-backdrop-filter:blur(16px) saturate(1.15);
}

/* Al aparecer la barra las piezas suben un poco y se compactan: es lo
   que hace que se lea como una barra y no como dos cosas flotando. */
body.is-scrolled .hud--tl,
body.is-scrolled .hud--tr{ top:var(--hud-y-min); }

/* La marca. El emblema es el trazo vectorizado del logo original; el
   resto son letras, con el mismo espaciado ancho del logo.

   En el logo van apilados (emblema arriba, texto abajo). Acá van uno
   al lado del otro: apilado ocuparía demasiado alto para una esquina
   y le comería aire al escenario. */
.mark{
  display:flex;
  align-items:center;
  gap:clamp(.6rem,1.1vw,.95rem);
  text-decoration:none;
  color:var(--ink);
}

.mark__emblem{
  width:clamp(1.85rem,2.9vw,2.6rem);
  height:auto;
  flex:none;
  /* Sobre el estudio claro el halo frío no tiene sentido: no hay una
     fuente de luz que lo justifique. Queda la sombra corta y difusa que
     proyectaría un objeto apoyado sobre la pared. */
  filter:drop-shadow(0 1px 2px rgba(16,18,22,.18));
  transition:opacity .4s var(--ease);
}
.mark:hover .mark__emblem,
.mark:focus-visible .mark__emblem{ opacity:.72; }
.mark:focus-visible{ outline:2px solid var(--ink); outline-offset:6px; border-radius:4px; }

.mark__type{ display:block; }
.mark__type b{
  display:block;
  font-size:clamp(.88rem,1.28vw,1.12rem);
  font-variation-settings:"wdth" 112,"wght" 500;
  letter-spacing:.3em;
  line-height:1;
}
.mark__type small{
  display:block;
  margin-top:.42rem;
  font-family:var(--mono);
  font-size:.5rem;
  font-weight:400;
  letter-spacing:.34em;
  color:var(--ink-3);
}
.mark__type i{ font-style:normal; color:var(--ink-3); opacity:.55; }

/* El menú. Mismo idioma que el rig: lo que se enciende es una barra de
   luz, no un subrayado. Sale del borde inferior con la misma curva que
   todo lo demás y deja el texto quieto — nada salta al pasar el mouse. */
.menu{
  display:flex;
  align-items:center;
  gap:clamp(1.4rem,2.8vw,2.6rem);
  font-family:var(--mono);
  font-size:.62rem;
  font-weight:400;
  letter-spacing:.26em;
  text-transform:uppercase;
}
.menu a{
  position:relative;
  display:block;
  padding:.55rem 0;
  color:var(--ink-2);
  text-decoration:none;
  transition:color .35s var(--ease);
}
/* El subrayado es el único lugar de toda la página donde aparece el
   rojo, y aparece a un pixel de alto. Sale de la óptica trasera del
   BMW: es el mismo rojo que ya está en el video y en las fotos, no un
   acento traído de afuera. */
.menu a::after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:.15rem;
  height:1px;
  background:var(--ember);
  transform:scaleX(0);
  transform-origin:50% 50%;
  transition:transform .45s var(--ease);
}
.menu a:hover,
.menu a:focus-visible{ color:var(--ink); }
.menu a:hover::after,
.menu a:focus-visible::after{ transform:scaleX(1); }
.menu a:focus-visible{ outline:none; }

/* ── las cifras que flanquean al auto ──────────────────────────── */

/* Acá se reparte el peso: dos números enormes a los costados hacen
   que el ojo cruce todo el cuadro en vez de clavarse en el auto. */
.figure{
  position:absolute;
  z-index:5;
  top:44%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
}
.figure--l{ left:var(--gut); align-items:flex-start; }
.figure--r{ right:var(--gut); align-items:flex-end; }

.figure b{
  display:block;
  font-size:clamp(2.6rem,7.4vw,7.4rem);
  font-variation-settings:"wdth" 64,"wght" 700;
  letter-spacing:-.02em;
  line-height:.82;
  /* El número se aclara hacia abajo, no se oscurece: sobre el estudio
     claro el degradado tiene que ir de la tinta al gris de la pared,
     que es al revés de como estaba sobre el negro. */
  background:linear-gradient(176deg, var(--chrome) 6%, #5C6270 88%);
  -webkit-background-clip:text;
          background-clip:text;
  color:transparent;
}
.figure i{
  font-style:normal;
  font-family:var(--mono);
  font-size:.58rem;
  letter-spacing:.28em;
  color:var(--steel);
  margin-top:.7rem;
}
.figure .slot{ overflow:hidden; }

.slot{ overflow:hidden; }
.slot > *{ display:block; will-change:transform; }

/* ── las flechas ───────────────────────────────────────────────── */

/* Apenas visibles: los autos pasan solos, así que esto es para el que
   se quiera adelantar. Sin círculo ni fondo — sólo el trazo, tenue,
   que se enciende al acercarse. */
.arrow{
  position:absolute;
  z-index:7;
  top:var(--ground);
  transform:translateY(-190%);
  width:2.6rem; height:2.6rem;
  display:grid; place-items:center;
  border:0;
  background:transparent;
  color:var(--chrome);
  opacity:.30;
  cursor:pointer;
  transition:opacity .35s var(--ease), transform .35s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.arrow--l{ left:calc(var(--gut) * .5); }
.arrow--r{ right:calc(var(--gut) * .5); }
.arrow svg{ width:100%; height:100%; }

.arrow:hover, .arrow:focus-visible{ opacity:1; }
.arrow--l:hover, .arrow--l:focus-visible{ transform:translate(-22%,-190%); }
.arrow--r:hover, .arrow--r:focus-visible{ transform:translate(22%,-190%); }
.arrow:focus-visible{ outline:1px solid rgba(var(--beam),.6); outline-offset:8px; }

/* ══════════════════════════════════════════════════════════════════
   LA CARGA

   El sitio son tres piezas de video pesadas. Sin esto, el visitante
   entra a una portada en negro que va apareciendo de a pedazos y, si
   scrollea enseguida, el reel se mueve a los saltos porque todavía se
   está bajando. Peor primera impresión imposible para una marca que
   vende autos premium.

   Así que se espera. Mientras tanto: negro, la marca, y una línea que
   avanza. No es un adorno — es la única forma de que una espera se
   sienta corta.

   El scroll queda bloqueado hasta el final: es literal lo que se pidió,
   que no se llegue al contenido antes de tiempo.
   ══════════════════════════════════════════════════════════════════ */

#loader{
  position:fixed;
  inset:0;
  z-index:200;
  background:#000;
  display:grid;
  place-items:center;
  gap:0;
  opacity:1;
  transition:opacity .7s var(--ease), visibility 0s linear .7s;
}

/* Al terminar se desvanece y deja de existir para el mouse y el
   teclado — si sólo bajara la opacidad seguiría tapando los clics. */
body.ya-cargo #loader{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

/* Mientras carga, la página no se mueve. */
body.cargando{ overflow:hidden; }

.loader-caja{ display:grid; justify-items:center; gap:clamp(1.8rem,4vh,2.8rem); }

.loader-marca{
  display:flex;
  align-items:center;
  gap:clamp(.6rem,1.1vw,.95rem);
  color:var(--chrome);
}
.loader-marca svg{
  width:clamp(2.4rem,4.2vw,3.4rem);
  height:auto;
  /* respira: no es un spinner, es una marca esperando */
  animation:latir 2.6s ease-in-out infinite;
}
.loader-marca b{
  font-size:clamp(1rem,1.5vw,1.3rem);
  font-variation-settings:"wdth" 112,"wght" 500;
  letter-spacing:.3em;
  line-height:1;
}

@keyframes latir{
  0%,100%{ opacity:.55 }
  50%    { opacity:1 }
}

/* La línea de progreso. Fina y ancha, en el idioma del resto del
   sitio: nada de círculos girando ni porcentajes. */
.loader-linea{
  position:relative;
  width:min(15rem,42vw);
  height:1px;
  background:rgba(255,255,255,.16);
  overflow:hidden;
}
.loader-linea span{
  position:absolute;
  inset:0 auto 0 0;
  width:100%;
  background:var(--chrome);
  transform:scaleX(var(--carga,0));
  transform-origin:0 50%;
  transition:transform .35s var(--ease);
}

@media (prefers-reduced-motion:reduce){
  .loader-marca svg{ animation:none; opacity:1; }
}

/* ══════════════════════════════════════════════════════════════════
   EL REEL — la vuelta al auto, movida por el scroll
   ══════════════════════════════════════════════════════════════════

   Son los dos videos del RS3 unidos en uno: de la cola al perfil y del
   perfil al frente. No se reproducen solos — el scroll es el que mueve
   el tiempo del video. Bajás y la cámara gira; parás y la cámara para.

   CÓMO FUNCIONA. La sección mide varias pantallas de alto y adentro
   hay un contenedor sticky de una pantalla. Mientras la sección pasa
   por la ventana, el video queda clavado y lo único que cambia es su
   currentTime, mapeado contra cuánto se avanzó de la sección.

   POR QUÉ NO SE TRABA. Dos cosas, y las dos son necesarias:

     1. El archivo está codificado ALL-INTRA: los 385 cuadros son
        keyframes. En un video normal los keyframes van cada 1-2
        segundos y el navegador, para mostrar un instante cualquiera,
        tiene que decodificar desde el keyframe anterior — eso es el
        tirón. Con todos los cuadros independientes, saltar a cualquier
        punto es inmediato. Cuesta tamaño y lo vale.

     2. El JS no escribe el scroll directo en el video: interpola. El
        tiempo real persigue al objetivo un 12% por cuadro, así que un
        golpe de rueda se convierte en un movimiento que desacelera
        solo. Sin eso el video se mueve a los saltos aunque el archivo
        esté bien.
   ══════════════════════════════════════════════════════════════════ */

#reel{
  position:relative;
  /* Cuánto scroll ocupa la vuelta completa. Más alto = giro más lento
     y más control; más bajo = más rápido. Es la perilla del ritmo. */
  height:var(--reel-h);
  background:#000;
}

.reel-stick{
  position:sticky;
  top:0;
  height:100svh;
  overflow:hidden;
  background:#000;
}

#reelVid{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

/* ══════════════════════════════════════════════════════════════════
   MODO OSCURO DE LA INTERFAZ

   La portada es un estudio CLARO y las dos secciones de abajo son
   negras. El HUD es fixed: el mismo logo y el mismo menú tienen que
   leerse sobre los dos fondos.

   Por eso hay dos estados. Sobre la portada la tipografía va en tinta
   oscura; apenas se pasa la portada, el body recibe .is-dark y todo se
   invierte. La transición es larga a propósito, para que se lea como
   un cambio de luz y no como un parpadeo.
   ══════════════════════════════════════════════════════════════════ */

.mark, .mark__type small, .mark__type i,
.menu a, .arrow, .scroll-cue{
  transition:color .5s var(--ease), opacity .5s var(--ease);
}

body.is-dark .mark{ color:var(--chrome); }
body.is-dark .mark__emblem{ filter:drop-shadow(0 0 .6rem rgba(var(--beam),.35)); }
body.is-dark .mark__type small,
body.is-dark .mark__type i{ color:var(--steel); }
body.is-dark .menu a{ color:var(--steel); }
body.is-dark .menu a:hover,
body.is-dark .menu a:focus-visible{ color:var(--chrome); }

/* el vidrio del header también se da vuelta */
body.is-dark.is-scrolled #topbar{
  background:linear-gradient(180deg, rgba(6,7,9,.82), rgba(6,7,9,.30));
}

/* ── pantallas chicas ──────────────────────────────────────────── */

/* En vertical el auto necesita subir: si el piso queda al 74% no
   entran las cifras ni el pie debajo. */
@media (orientation:portrait){
  :root{ --ground:57%; }
  /* en vertical el auto es chico: el nombre tiene que arrimarse, si no
     queda flotando solo arriba y no se lee */
  #word{
    top:calc(var(--ground) - clamp(3rem,10vh,7.5rem));
    font-size:clamp(2.4rem,19vw,7.5rem);
    color:#1E2027;
  }
}

@media (max-width:767px){
  /* El reel SÍ va en celular, con su pieza vertical propia, pero el
     recorrido se acorta.

     EL EQUILIBRIO. Con los 720svh de computadora el giro avanza 2,56 s
     de video por pantalla. A 380svh en celular avanzaba 5,68 s: el
     doble de apurado, se sentía otro sitio. A 520svh queda en ~3,2 s
     por pantalla, cerca del ritmo de computadora.

     No se copia el valor de escritorio tal cual a propósito: en un
     teléfono un envión del pulgar recorre muchas más pantallas que una
     rueda de mouse, así que 720svh ahí se vuelve una escalera
     interminable. Lo que tiene que coincidir es la SENSACIÓN, no el
     número. */
  :root{ --reel-h:520svh; }
}

@media (max-width:760px){
  .menu{ display:none; }
  /* las cifras bajan y se apoyan sobre la línea del piso, una a cada
     lado, en vez de flotar a media altura */
  .figure{
    top:calc(var(--ground) + clamp(2.2rem,7vh,4.5rem));
    transform:none;
  }
  .figure b{ font-size:clamp(2.4rem,13vw,3.6rem); }
  .figure i{ margin-top:.45rem; font-size:.52rem; letter-spacing:.2em; }

  /* con las cifras abajo, las flechas se corren a la altura del auto
     para no encimarse con ellas */
  .arrow{ width:2.1rem; height:2.1rem; transform:translateY(-260%); }
  .arrow--l:hover, .arrow--l:focus-visible{ transform:translate(-18%,-260%); }
  .arrow--r:hover, .arrow--r:focus-visible{ transform:translate(18%,-260%); }
}

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001s !important; transition-duration:.001s !important }
}
</style>
</head>

<!-- La barra del header. Vacía a propósito: es sólo el vidrio que

<!-- Portada en video. Primera pantalla del sitio; el escenario del auto
     quedó debajo. El video no tiene audio: muted + playsinline son lo que
     habilita el autoplay en iOS y Chrome, no una cuestión de sonido.
     El poster deja el primer cuadro fijo mientras carga, así que la
     portada nunca se ve negra. -->
<section id="cover">
  <video id="coverVid"
    autoplay
    muted
    loop
    playsinline
    preload="metadata"></video>

  <script>
  /* DOS DECISIONES ACÁ ADENTRO
     ─────────────────────────────────────────────────────────────────
     1) QUÉ PIEZA: son dos videos distintos, no dos calidades del mismo.
        El de computadora es horizontal y el de teléfono es vertical,
        filmados aparte. Cambian juntos el video y su poster.

        Se mide la PANTALLA y no la ventana: innerWidth acá se lee
        mientras la página todavía se parsea, y si en ese instante la
        ventana no tiene su tamaño final —o el usuario la tiene angosta
        en un monitor grande— quedaba fijada la pieza equivocada para
        toda la sesión. screen.width no cambia.

     2) QUÉ CODEC: se ofrecen tres archivos del MISMO video y el
        navegador se queda con el primero que sabe decodificar.

          AV1   1,3-1,6 MB  Chrome, Edge, Firefox, Android, Safari 17+
          HEVC  1,4-1,6 MB  Safari e iOS (decodifican por hardware)
          H.264  13-14 MB   red de seguridad universal

        Los tres tienen la misma calidad visual; AV1 y HEVC son
        simplemente codecs más eficientes. En la práctica casi nadie
        baja el H.264: está para que ningún navegador quede afuera.

        La cadena de `codecs` tiene que ser exacta — si falta o está
        mal, el navegador no puede saber si sabe reproducir el archivo
        y termina eligiendo uno que no puede decodificar. Los valores
        salen del archivo real: AV1 perfil Main nivel 8 (4.0) 8 bits,
        HEVC perfil Main nivel 120 (4.0).

        Se usan <source> y no una asignación directa a src porque si un
        archivo falla al cargar, el navegador pasa solo al siguiente. */
  (function(){
    var v = document.getElementById('coverVid');

    var pantalla = (window.screen && screen.width) || window.innerWidth || 1920;
    var base = 'assets/video/portada-' + (pantalla <= 767 ? 'mobile' : 'desktop');

    v.poster = base + '-poster.jpg';

    [ ['-av1.mp4',  'video/mp4; codecs="av01.0.08M.08"'],
      ['-hevc.mp4', 'video/mp4; codecs="hvc1.1.6.L120.B0"'],
      ['.mp4',      'video/mp4'] ].forEach(function(f){
      var s = document.createElement('source');
      s.src  = base + f[0];
      s.type = f[1];
      v.appendChild(s);
    });
  })();

  /* Estado del header. Apenas se scrollea un poco, el body recibe
     .is-scrolled y con eso aparece el vidrio del #topbar y el HUD se
     compacta. Todo el movimiento lo hace el CSS con transiciones; acá
     sólo se prende y apaga una clase.

     El listener es passive y sólo escribe cuando el estado CAMBIA, así
     no toca el DOM en cada píxel de scroll. */
  (function(){
    var limite = 24, puesto = null;
    var oscuro = null;
    var portada = document.getElementById('cover');
    /* La franja se busca en el primer scroll y no acá: este script vive
       DENTRO de #cover, así que corre mientras la página se está
       parseando y #band todavía no existe. Buscarla ahora devolvía
       null y el efecto no se aplicaba nunca. */
    var franja = null, texto = null;

    function mirar(){
      var si = window.scrollY > limite;
      if (si !== puesto){
        puesto = si;
        document.body.classList.toggle('is-scrolled', si);
      }

      /* EL APAGADO A NEGRO. La portada se va oscureciendo con el scroll
         y llega a negro pleno ANTES de terminar de salir (al 82% de su
         alto), no justo al final. Si llegara justo, el último tramo se
         vería todavía con algo de imagen y el corte con la franja negra
         de abajo se notaría. Terminando antes, lo último que se ve de
         la portada ya es del mismo color que lo que sigue. */
      if (portada){
        var h = portada.offsetHeight * 0.82;
        var f = h > 0 ? window.scrollY / h : 0;
        f = f < 0 ? 0 : (f > 1 ? 1 : f);
        portada.style.setProperty('--fade', f.toFixed(3));
      }
      /* Segundo estado: apenas se deja atrás la portada clara, la
         interfaz se invierte para leerse sobre el negro de abajo. Se
         cambia antes de llegar del todo (al 72%) para que el logo no
         quede un instante en tinta oscura sobre fondo negro. */
      /* EL FOCO DE LA FRANJA. --p va de 0 a 1 según qué tan cerca está
         el centro de la franja del centro de la pantalla. El CSS lo usa
         para el desenfoque, la opacidad y la convergencia de las dos
         líneas.

         Se eleva al cuadrado (p*p) para que el enfoque no sea lineal:
         así el texto pasa la mayor parte del recorrido todavía blando y
         resuelve rápido cerca del centro, que es como enfoca una lente
         de verdad. Lineal se siente mecánico. */
      if (!texto){
        franja = document.getElementById('band');
        texto  = franja && franja.querySelector('.band-copy');
      }
      if (texto){
        var rf = franja.getBoundingClientRect();
        var centroF = rf.top + rf.height / 2;
        var centroV = window.innerHeight / 2;
        var alcance = window.innerHeight / 2 + rf.height / 2;
        var p = 1 - Math.abs(centroF - centroV) / alcance;
        p = p < 0 ? 0 : (p > 1 ? 1 : p);
        texto.style.setProperty('--p', (p * p).toFixed(3));
      }

      /* Se reusa la misma `portada` de arriba. Declararla de nuevo acá
         con var la elevaba al inicio de la función y la dejaba en
         undefined justo donde se calcula el apagado. */
      var corte = portada ? portada.offsetHeight * 0.72 : window.innerHeight * 0.72;
      var osc = window.scrollY > corte;
      if (osc !== oscuro){
        oscuro = osc;
        document.body.classList.toggle('is-dark', osc);
      }
    }
    addEventListener('scroll', mirar, { passive:true });
    mirar();
  })();

  </script>

<!-- El reel: la vuelta al auto. No se reproduce solo — lo mueve el
     scroll. El contenedor mide varias pantallas y el video queda
     pegado adentro mientras la sección pasa. -->
<section id="reel">
  <div class="reel-stick">
    <video id="reelVid" muted playsinline preload="auto"></video>
  </div>
</section>

<script>
(function(){
  var sec = document.getElementById('reel');
  var v   = document.getElementById('reelVid');

  /* En celular todavia no hay pieza propia, asi que la seccion entera
     se oculta (ver el @media) y aca ni siquiera se pide el archivo: no
     tiene sentido bajar 10 MB para algo que no se muestra. Cuando
     llegue el video vertical se agrega aca y se saca el display:none. */
  /* Dos piezas distintas, como en la portada: la de computadora es
     horizontal y la de celular es vertical, filmadas aparte. Se mira el
     MENOR entre pantalla y ventana para que una ventana de escritorio
     angosta reciba la vertical, que es la que le va a entrar bien. */
  var pantalla = Math.min(
    (window.screen && screen.width) || 9999,
    window.innerWidth || 9999
  );
  var base = 'assets/video/reel-' + (pantalla <= 767 ? 'mobile' : 'desktop');
  v.poster = base + '-poster.jpg';
  v.src    = base + '.mp4';

  var dur = 0, objetivo = 0, actual = 0, vivo = false;

  /* Cuánto se avanzó de la sección, de 0 a 1. */
  function avance(){
    var r = sec.getBoundingClientRect();
    var recorrido = sec.offsetHeight - window.innerHeight;
    if (recorrido <= 0) return 0;
    var p = -r.top / recorrido;
    return p < 0 ? 0 : (p > 1 ? 1 : p);
  }

  /* El bucle. `actual` persigue a `objetivo` en vez de saltar a él: eso
     es lo que convierte un golpe de rueda en un movimiento que frena
     solo. Cuando la diferencia es despreciable se deja de escribir en
     el video, para no pedirle un seek por cuadro estando quieto. */
  function cuadro(){
    objetivo = avance() * dur;
    var d = objetivo - actual;
    if (Math.abs(d) > 0.0015){
      actual += d * 0.12;
      try { v.currentTime = actual; } catch(e){}
    }
    requestAnimationFrame(cuadro);
  }

  v.addEventListener('loadedmetadata', function(){
    dur = v.duration || 0;
    actual = objetivo = avance() * dur;
    try { v.currentTime = actual; } catch(e){}
    if (!vivo){ vivo = true; requestAnimationFrame(cuadro); }
  });
})();
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   LA CARGA — qué se espera y hasta cuándo

   Se espera lo que hace falta para que la PRIMERA impresión y el
   PRIMER scroll estén bien:

     · las tipografías        20%   si llegan tarde, el texto salta
     · el video de portada    35%   es lo primero que se ve
     · el video del reel      45%   es lo que se rompe si falta

   El reel pesa 10 MB en computadora y 5,4 en celular. Es el que más
   tarda y por eso el que más porcentaje ocupa: la barra tiene que
   reflejar la espera real, no llegar al 90% en un segundo y quedarse
   ahí, que es la forma más rápida de que una carga se sienta rota.

   HAY UN TECHO DE 15 SEGUNDOS. Con una conexión mala, esperar los
   10 MB completos es peor que entrar con el reel a medio bajar: el
   scroll se recupera solo a medida que llega. Nadie se queda mirando
   un negro indefinido.
   ═══════════════════════════════════════════════════════════════════ */
(function(){
  var cuerpo = document.body;
  cuerpo.classList.add('cargando');

  /* El navegador restaura el scroll al recargar. Si no se desactiva,
     alguien que recarga a mitad de página entra con el loader puesto
     pero el scroll a la mitad, y al soltarlo aparece en cualquier lado. */
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);

  var linea = document.querySelector('.loader-linea span');
  var pesos = { fuentes:.20, portada:.35, reel:.45 };
  var estado = { fuentes:0, portada:0, reel:0 };
  var terminado = false;

  function pintar(){
    var p = estado.fuentes*pesos.fuentes + estado.portada*pesos.portada + estado.reel*pesos.reel;
    if (linea) linea.style.setProperty('--carga', Math.min(1, p).toFixed(3));
    if (p >= .999) listo();
  }

  function listo(){
    if (terminado) return;
    terminado = true;
    if (linea) linea.style.setProperty('--carga', '1');
    window.scrollTo(0, 0);
    cuerpo.classList.remove('cargando');
    cuerpo.classList.add('ya-cargo');
    /* El scroll arranca recién ahora: se avisa a los efectos para que
       tomen su estado inicial en vez de esperar al primer movimiento. */
    window.dispatchEvent(new Event('scroll'));
  }

  /* Tipografías */
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ estado.fuentes = 1; pintar(); });
  } else { estado.fuentes = 1; }

  /* Un video: se sigue cuánto lleva bufereado contra su duración. */
  function seguir(id, clave){
    var v = document.getElementById(id);
    if (!v){ estado[clave] = 1; pintar(); return; }

    function medir(){
      if (!v.duration || !isFinite(v.duration)) return;
      var fin = 0;
      for (var i = 0; i < v.buffered.length; i++) fin = Math.max(fin, v.buffered.end(i));
      /* No se espera el archivo entero: con el 85% bajado el scrub ya
         no se queda sin datos, y el resto llega mientras se mira. */
      estado[clave] = Math.min(1, (fin / v.duration) / .85);
      pintar();
    }

    ['progress','loadeddata','canplay','canplaythrough','timeupdate'].forEach(function(e){
      v.addEventListener(e, medir);
    });
    v.addEventListener('error', function(){ estado[clave] = 1; pintar(); });
    medir();
  }

  seguir('coverVid', 'portada');
  seguir('reelVid', 'reel');

  /* Red de seguridad: pase lo que pase, a los 15 segundos se entra. */
  setTimeout(listo, 15000);
  pintar();
})();
</script>

<script>
(function(){

     Encaje.

     El marco del auto está atado al ALTO de la ventana, así que su
     ancho no tiene nada que ver con el ancho de la pantalla: en un
     teléfono el marco es cuatro veces más ancho que el visor. Por eso
     la escala del auto no puede ser un número fijo en el CSS — hay
     que calcularla para que el auto ocupe siempre la misma porción
     del ancho disponible.

     De paso publica --carw, el ancho real del auto en pantalla, que
     es contra lo que se dimensiona la brasa del piso.
     ───────────────────────────────────────────────────────────── */
  const AR = 1672 / 941;
  const CAR_IN_FRAME = .84;        // cuánto del marco ocupa el auto, medido

  let travel = 130;                // recorrido de la cinta, en xPercent

  function fit(){
    const vw = innerWidth, vh = innerHeight;
    const frameW = vh * AR;
    const share  = vw < 760 ? .74 : .42;   // del ancho de la ventana
    const carW   = vw * share;
    const root = document.documentElement.style;
    root.setProperty('--car',  (carW / (frameW * CAR_IN_FRAME)).toFixed(4));
    root.setProperty('--carw', Math.round(carW) + 'px');

    /* Cuánto tiene que viajar el auto para salir limpio de cuadro:
       media pantalla más medio auto, más un respiro. Se expresa en
       xPercent —que es relativo al ancho del <img>, no al de la
       ventana—, y por eso hay que recalcularlo: un número fijo dejaba
       media trompa colgando en pantallas anchas. */
    travel = ((vw + carW) / 2 + 40) / (carW / CAR_IN_FRAME) * 100;
  }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', fit);

  /* Huella de las fotos. La escribe tools/build-cars.py en cada corrida
     y va pegada a cada URL, así que cuando una foto cambia, cambia la
     dirección que pide el navegador.

     Sin esto no hay forma de que veas una foto nueva: el navegador tiene
     guardada la vieja bajo esa misma dirección y la muestra sin volver a
     preguntar. En Cloudflare es peor, porque además hay un CDN cacheando
     en el medio. */
  const FOTOS = 'ef05ce9b';

  const imgs = CARS.map((c,i)=>{
    const el = document.createElement('img');
    el.className = 'car' + (i===0 ? ' is-on' : '');
    el.src = `assets/cars/${c.slug}.webp?v=${FOTOS}`;
    el.srcset = `assets/cars/${c.slug}@sm.webp?v=${FOTOS} 1100w, ` +
                `assets/cars/${c.slug}.webp?v=${FOTOS} 1672w, ` +
                `assets/cars/${c.slug}@2x.webp?v=${FOTOS} 3344w`;

    el.alt = c.model;
    el.decoding = 'async';
    el.fetchPriority = i===0 ? 'high' : 'low';

  });

     El cambio.

     El auto que está se va DEL LADO DE LA FLECHA que se tocó, y el
     que entra crece desde atrás, como si hubiera estado esperando en
     la penumbra detrás del primero.

     Dos reglas que no se negocian:
     · Nada se mueve en Y. Cualquier corrimiento vertical acá se lee
       como que la página se movió.
     · El rig no se desplaza NUNCA. Sólo late: la barra se apaga
       cuando el escenario queda vacío y pega un flash cuando el auto

     ───────────────────────────────────────────────────────────── */
  function go(dir, to, solo){

       y se ejecuta al terminar. Sin esto, apurar las flechas se siente
       como que la página ignora los clics.

       El pase automático es la excepción: si está ocupado se saltea el
       turno en vez de anotarse. Encolándolo pasaba que tocabas la
       flecha para atrás, el pase encolaba su avance, y al terminar tu
       transición saltaba para adelante — pedías el anterior y te daba
       el siguiente. */
    if (busy){
      if (solo) return;
      queued = to !== undefined ? to : (cur + dir + CARS.length) % CARS.length;
      return;
    }
    const nx = to !== undefined
      ? to
      : (cur + dir + CARS.length) % CARS.length;
    if (nx === cur) return;
    const D = to !== undefined ? (nx > cur ? 1 : -1) : (dir > 0 ? 1 : -1);

    next.classList.add('is-on');

        busy = false;
        if (queued !== null){ const q = queued; queued = null; go(0, q); }
        else seguir();      // recién acá el auto quedó quieto de verdad
      }
    });

    /* ── LA CINTA ────────────────────────────────────────────────
       Los dos autos son un solo movimiento. Arrancan juntos, viajan
       la MISMA distancia, en la MISMA dirección, con la MISMA curva
       de velocidad. Es lo que hace que se lea como una calesita y no
       como dos animaciones que casualmente coinciden.

       Nada de escala ni de desplazamiento vertical: sobre una
       carretera el auto no se acerca ni se aleja, sólo pasa.

       `travel` es cuánto hay que correrlos para que salgan limpios
       de cuadro, y lo calcula fit() según el tamaño de la ventana:
       un porcentaje fijo dejaría media trompa colgando en pantallas
       anchas.

       M es hacia dónde CORRE LA CINTA, y es al revés de la flecha que
       se tocó: con "siguiente" la cinta empuja hacia la izquierda y el
       auto nuevo entra por la derecha, igual que al pasar la página de
       un libro. Al revés —el auto saliendo del mismo lado de la flecha—
       se lee como retroceder, aunque el que aparezca sea el siguiente. */
    const M = -D;

    G.set(next, { xPercent:-travel*M, scale:1.035,
                  filter:'blur(11px) brightness(1) saturate(1.16)' });

    tl.to(from, { xPercent: travel*M, duration:T, ease:'power2.inOut' }, 0)
      .to(next, { xPercent: 0,        duration:T, ease:'power2.inOut' }, 0);

    /* ── el aire de la cinta ─────────────────────────────────────
       Lo que da la sensación de velocidad es el DESENFOQUE, no el
       apagón. Antes los dos autos pasaban por brightness .72 justo
       en el medio del cuadro, que es donde más se los mira: un verde
       al 72% no se lee como "a contraluz", se lee como lavado. Ése
       era el gris.

       Ahora el color va a pleno todo el trayecto y lo único que
       cuenta el movimiento es el blur. El que se va sólo se apaga al
       final, cuando ya salió de cuadro y no hay nada que ensuciar.
       El que llega remata con un golpe de luz —brillo por encima de
       1, no por debajo— como si lo agarrara el foco al frenar. */
    tl.to(from, { keyframes:[
        { filter:'blur(11px) brightness(1) saturate(1.16)', duration:T*.55, ease:'power1.in'  },
        { filter:'blur(5px) brightness(.12) saturate(1)',   duration:T*.45, ease:'power2.in'  }
      ]}, 0)
      .to(next, { keyframes:[
        { filter:'blur(7px) brightness(1.04) saturate(1.14)', duration:T*.55, ease:'power1.inOut' },
        { filter:'blur(0px) brightness(1.22) saturate(1.05)', duration:T*.30, ease:'power2.out'   },
        { filter:'blur(0px) brightness(1) saturate(1)',       duration:T*.15, ease:'power1.out'   }
      ]}, 0);

    /* y se asienta: llega apenas más grande y baja a su tamaño. Es un
       gesto de peso, no de escala — 3,5% no se nota como zoom, se nota
       como que el auto frenó. */
    tl.to(next, { scale:1, duration:T*.92, ease:'power3.out' }, 0);

    /* ── el rig acompaña ─────────────────────────────────────────
       No se mueve: se apaga mientras el escenario está de paso y
       vuelve cuando el auto nuevo frena en el centro. */
    tl.to('#horizon', { opacity:.34, duration:T*.42, ease:'power2.inOut' }, 0)
      .to('#horizon', { opacity:1, scaleY:2.4, duration:.14, ease:'power2.out' }, T*.78)
      .to('#horizon', { scaleY:1, duration:.7, ease:'elastic.out(1,.5)' }, T*.9);

    tl.to('#ember', { opacity:.2, duration:T*.42, ease:'power2.inOut' }, 0)
      .to('#ember', { opacity:1.4, duration:.16, ease:'power2.out' }, T*.78)
      .to('#ember', { opacity:1, duration:.6 }, T*.95);

    /* El punto caliente viaja CON los autos, no en contra: es el
       reflejo del auto corriendo sobre la barra.

       Los porcentajes son de su propio ancho, que es el 30% de la
       tarima: para cruzarla entera hace falta llegar a 233%, no más.
       Cuando la barra iba de punta a punta el recorrido era otro. */
    tl.fromTo('#sweep',
      { xPercent: M>0 ? -110 : 245, opacity:0 },
      { xPercent: M>0 ? 245 : -110, opacity:1, duration:T, ease:'power2.inOut' }, 0)
      .to('#sweep', { opacity:0, duration:.2 }, T*.85);

    /* el cartel del fondo viaja en el mismo sentido pero más lejos:
       ese desfasaje da profundidad sin usar 3D */
    tl.to(word, { xPercent:-50 + 46*M, opacity:0, duration:T*.45, ease:'power2.in' }, 0)
      .add(()=>paint(nx), T*.46)
      .fromTo(word,
        { xPercent:-50 - 46*M, opacity:0 },
        { xPercent:-50, opacity:1, duration:T*.62, ease:'power2.out' }, T*.46);

    /* las cifras y el nombre se recomponen desde su ventanita */
    tl.to('.slot > *', { yPercent:-115, duration:T*.3, ease:'power2.in', stagger:.03 }, 0)
      .fromTo('.slot > *', { yPercent:115 },
        { yPercent:0, duration:T*.6, ease:'power3.out', stagger:.045 }, T*.48);

    cur = nx;
  }

  /* ─────────────────────────────────────────────────────────────
     El pase solo.

     PAUSA es cuánto QUIETO tiene que quedar el auto, no cada cuánto
     arranca la cinta. Si se programara con un intervalo fijo de 2s
     desde que EMPIEZA cada cambio, y el cambio en sí tarda casi 1s,
     el auto sólo estaría quieto ~1s de esos 2 — que es exactamente lo
     que pasaba antes: se sentía el doble de rápido de lo que decía el
     número. Por eso el próximo pase se agenda al TERMINAR el actual
     (acá, al final de go), no en un reloj que corre por su cuenta.

     Y se detiene cuando la pestaña no está a la vista: seguir pasando
     autos que nadie mira sólo gasta batería.
     ───────────────────────────────────────────────────────────── */
  const PAUSA = 2000;
  let espera = null, activo = false;

  function seguir(){
    if (still || !activo) return;       // sin animación no hay carrusel
    clearTimeout(espera);
    espera = setTimeout(()=>go(1, undefined, true), PAUSA);
  }
  function frenar(){ clearTimeout(espera); espera = null; }

  /* Toda interacción manual pasa por acá: se cancela el pase pendiente
     —si acabás de pedir un auto, lo último que querés es que se te
     vaya a los pocos milisegundos porque justo tocaba el cambio— y el
     próximo se reagenda solo, PAUSA ms después de que ESTA transición
     termine, vía el `seguir()` al final de go(). */
  function pedir(dir, to){ activo = true; frenar(); go(dir, to); }

  document.addEventListener('visibilitychange', ()=>{
    if (document.hidden) frenar(); else seguir();
  });

  /* ── controles ─────────────────────────────────────────────── */

  $('next').addEventListener('click', ()=>pedir(1));
  $('prev').addEventListener('click', ()=>pedir(-1));

  /* mientras el mouse está sobre una flecha no se cambia solo: da
     tiempo a hacer clic sin que el auto se escape */
  [$('next'), $('prev')].forEach(b=>{
    b.addEventListener('pointerenter', frenar);
    b.addEventListener('pointerleave', seguir);
  });

  addEventListener('keydown', e=>{
    if (e.key === 'ArrowRight'){ e.preventDefault(); pedir(1); }
    if (e.key === 'ArrowLeft'){  e.preventDefault(); pedir(-1); }
  });

  let sx = null, sy = null;
  const stage = $('stage');
  stage.addEventListener('pointerdown', e=>{ sx = e.clientX; sy = e.clientY; });
  stage.addEventListener('pointerup', e=>{
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    sx = null;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) pedir(dx < 0 ? 1 : -1);
  });

  /* ── vida propia: el rig respira aunque nadie toque nada ────── */

  if (!still){
    G.to('.l-cone--l', { opacity:.32, duration:5.5, yoyo:true, repeat:-1, ease:'sine.inOut' });
    G.to('.l-cone--r', { opacity:.32, duration:6.8, yoyo:true, repeat:-1, ease:'sine.inOut', delay:.9 });
    G.set('#sweep', { opacity:0 });

    G.timeline({ defaults:{ ease:'power3.out' } })
      .from('.l-ambient', { opacity:0, duration:1.3 })
      .from('#horizon',   { scaleX:0, duration:1.15, ease:'power4.out' }, .15)
      .from('.l-reflect, .l-ember', { opacity:0, duration:.9 }, .5)
      .from('.l-cone',    { opacity:0, duration:1.1 }, .5)
      /* clearProps no es opcional acá. `from` deja el valor final
         escrito en el atributo style, y un opacity:1 en línea le gana
         a la regla .car{opacity:0}: el primer auto no se apagaba nunca
         y quedaba asomando detrás de todos los demás. */
      .from(imgs[0],      { opacity:0, scale:1.07, filter:'blur(14px)', duration:1.2,
                            clearProps:'opacity,transform,filter' }, .45)
      .from(word,         { opacity:0, scale:1.06, duration:1 }, .6)
      .from('.hud--tl, .hud--tr', { opacity:0, y:-12, duration:.6, stagger:.08 }, .7)
      .from('.slot > *',  { yPercent:115, duration:.75, stagger:.06 }, .8)
      /* clearProps otra vez: sin esto queda un opacity:1 en línea que
         le gana a .arrow{opacity:.26} y las flechas dejan de ser
         discretas — y encima el :hover no tendría a dónde subir. */
      .from('.arrow',     { opacity:0, duration:.7, stagger:.08,
                            clearProps:'opacity' }, 1);

    /* el pase solo empieza cuando terminó de entrar la página, y desde
       acá cuenta PAUSA completos porque el auto ya está quieto */
    setTimeout(()=>{ activo = true; seguir(); }, 1800);
  }
})();
</script>
</body>
</html>
