<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manna Motors Selected — Automóviles seleccionados</title>
<meta name="description" content="Selección de automóviles deportivos. Cada unidad revisada, con historial verificado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Chivo+Mono:wght@300..600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   MERIDIANO — showroom

   La idea: el auto no es la página, es lo que está parado en el
   escenario. Quien manda es la luz.

   EL RIG. Seis capas de luz, todas dibujadas por CSS, ninguna es una
   foto. Se reparten por todo el cuadro para que la energía no quede
   amontonada abajo del auto:

     · horizonte  — la barra que cruza de lado a lado a la altura del
                    piso. Es la que hace que el auto se recorte contra
                    algo en vez de flotar en la nada.
     · reflejo    — la barra derramándose sobre el piso pulido
     · conos      — dos haces cenitales que caen desde arriba
     · brasa      — la mancha caliente justo abajo del auto
     · ambiente   — un lavado general que despega el negro del vacío

   Nada de esto se mueve cuando cambia el auto. Sólo late.

   EL AUTO. Va recortado con transparencia, encima del rig, y a poco
   más de la mitad de su tamaño natural (--car). Se escala desde la
   línea del piso, no desde el centro, para que las ruedas queden
   apoyadas donde está la barra de luz por más que cambie la escala.

   Sin color de acento. El acento es la luz — un blanco frío que es lo
   único que brilla en toda la página.
   ══════════════════════════════════════════════════════════════════ */

:root{
  --void:#000000;
  --chrome:#F2F4F8;
  --steel:#7E8593;
  --graphite:#454A55;
  --ghost:#141519;

  --beam:214,232,255;        /* el blanco frío del rig, en RGB */

  --display:"Archivo",-apple-system,system-ui,sans-serif;
  --mono:"Chivo Mono",ui-monospace,Menlo,monospace;

  --gut:clamp(1.15rem,3.2vw,3rem);
  --ease:cubic-bezier(.22,1,.36,1);

  --ar:1672 / 941;           /* proporción nativa de las fotos */
  /* Dónde apoyan las ruedas DENTRO de la foto. Lo fija el script de
     recorte (GROUND en tools/build-cars.py) y no se toca desde acá:
     si cambia uno hay que cambiar el otro. */
  --img-ground:74%;
  --ground:74%;              /* altura de la línea del piso en la ventana */
  --car:.60;                 /* escala del auto — la recalcula el JS */
  --carw:50vw;               /* ancho real del auto en pantalla — ídem */
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{height:100%}
body{
  background:var(--void);
  color:var(--chrome);
  font-family:var(--display);
  overflow:hidden;           /* esto no scrollea nunca */
  -webkit-font-smoothing:antialiased;
}

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:var(--void);
  touch-action:none;
}

/* ── marco: sólo el auto vive acá ──────────────────────────────── */

/* Va SIEMPRE atado al alto de la ventana, nunca al ancho. Ése es el
   truco que mantiene la línea del piso en el mismo lugar de la
   pantalla en cualquier formato: si el alto del marco es 100vh, el
   piso cae en var(--ground) de la ventana, y el rig —que ocupa la
   ventana entera— puede dibujar su barra justo ahí.

   A lo ancho el marco se desborda, y no importa: lo único que hay
   adentro es el auto, que se achica con --car hasta entrar. */
#frame{
  position:absolute;
  top:0; left:50%;
  transform:translateX(-50%);
  height:100vh;
  width:calc(100vh * var(--ar));
  z-index:3;
}

/* ══════════════════════════════════════════════════════════════════
   EL RIG DE LUCES
   ══════════════════════════════════════════════════════════════════ */

#rig{ position:absolute; inset:0; z-index:1; }
#rig > *{ position:absolute; pointer-events:none; }

/* lavado general: sin esto el negro se lee como un agujero */
.l-ambient{
  inset:0;
  background:
    radial-gradient(120% 80% at 50% 96%, rgba(var(--beam),.07), transparent 62%),
    radial-gradient(80% 55% at 50% 8%,  rgba(var(--beam),.045), transparent 70%);
}

/* dos haces cenitales que bajan y se abren hacia el auto */
.l-cone{
  top:-14%; width:46%; height:96%;
  filter:blur(34px);
  opacity:.5;
}
.l-cone--l{
  left:-2%;
  background:linear-gradient(163deg, rgba(var(--beam),.16) 0%, transparent 58%);
}
.l-cone--r{
  right:-2%;
  background:linear-gradient(197deg, rgba(var(--beam),.16) 0%, transparent 58%);
}


/* LA FIRMA — la barra de horizonte. Cruza todo el ancho a la altura
   del piso; es contra esto que el auto se recorta. */
.l-horizon{
  left:0; right:0; top:var(--ground);
  height:2px;
  transform:translateY(-1px);
  background:linear-gradient(90deg,
    transparent 0%, rgba(var(--beam),.35) 14%,
    rgba(var(--beam),.95) 38%, #FFFFFF 50%, rgba(var(--beam),.95) 62%,
    rgba(var(--beam),.35) 86%, transparent 100%);
}
/* el resplandor que la barra tira hacia arriba */
.l-horizon::before{
  content:"";
  position:absolute; left:0; right:0; bottom:0;
  height:clamp(7rem,20vh,15rem);
  background:linear-gradient(0deg, rgba(var(--beam),.22), transparent 78%);
  -webkit-mask-image:linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
          mask-image:linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
}
/* el punto caliente que recorre la barra de punta a punta */
.l-sweep{
  left:0; top:var(--ground);
  width:26%; height:2px;
  transform:translate(-40%,-1px);
  background:radial-gradient(closest-side, #FFFFFF, transparent);
  opacity:.9;
}

/* el piso pulido devolviendo la barra */
.l-reflect{
  left:0; right:0; top:var(--ground); bottom:0;
  background:linear-gradient(180deg, rgba(var(--beam),.14), transparent 58%);
  -webkit-mask-image:linear-gradient(90deg, transparent, #000 26%, #000 74%, transparent);
          mask-image:linear-gradient(90deg, transparent, #000 26%, #000 74%, transparent);
}

/* la brasa: la mancha caliente justo abajo del auto. Angosta y dura,
   no el charco redondo y blando de antes. */
/* Se mide contra --carw (el ancho real del auto en pantalla, que
   calcula el JS) y no contra un % de la ventana: si no, en un
   teléfono la brasa quedaba más angosta que el auto y se veía como
   una mancha suelta abajo. */
.l-ember{
  left:50%; top:var(--ground);
  width:calc(var(--carw) * .92); height:clamp(2.5rem,8vh,7rem);
  transform:translate(-50%,-38%);
  background:radial-gradient(ellipse 50% 50% at 50% 50%, rgba(var(--beam),.5), transparent 68%);
  filter:blur(10px);
}

/* ── el nombre gigante, atrás de todo ──────────────────────────── */

#word{
  position:absolute;
  z-index:2;
  left:50%;
  /* colgado de la línea del piso, no de un % suelto: así queda detrás
     del auto en cualquier formato de pantalla. La resta lo sube justo
     lo necesario para que asome por encima del techo. */
  top:calc(var(--ground) - clamp(11rem,36vh,24rem));
  transform:translate(-50%,-50%);
  font-size:clamp(3.6rem,17vw,15rem);
  font-variation-settings:"wdth" 66,"wght" 800;
  letter-spacing:-.025em;
  line-height:.8;
  white-space:nowrap;
  color:var(--ghost);
  pointer-events:none;
  user-select:none;
  will-change:transform,opacity;
}

/* ── el auto ───────────────────────────────────────────────────── */

/* Dos movimientos distintos, y hay que no mezclarlos:

   · La ESCALA se hace desde donde apoyan las ruedas en la foto
     (--img-ground). Así el auto se achica sin despegarse del piso.
   · El DESPLAZAMIENTO lleva ese piso hasta donde está la barra de luz
     (--ground). En horizontal los dos valores coinciden y no se mueve
     nada; en vertical el auto sube para dejar lugar abajo.

   Cuando escalaba desde --ground en vez de --img-ground, achicar el
   auto le corría las ruedas hacia abajo y la barra quedaba por encima
   de la rueda. */
#deck{
  position:absolute; inset:0;
  transform:translateY(calc(var(--ground) - var(--img-ground))) scale(var(--car));
  transform-origin:50% var(--img-ground);
}

.car{
  position:absolute;
  inset:0;
  width:100%; height:100%;
  object-fit:fill;          /* el marco ya tiene la proporción exacta */
  opacity:0;
  pointer-events:none;
  will-change:transform,opacity,filter;
}
.car.is-on{ opacity:1; }

/* ══════════════════════════════════════════════════════════════════
   INTERFAZ
   ══════════════════════════════════════════════════════════════════ */

.hud{ position:absolute; z-index:6; }
.hud--tl{ top:var(--gut); left:var(--gut); }
.hud--tr{ top:var(--gut); right:var(--gut); }

/* La marca. El emblema es el trazo vectorizado del logo original; el
   resto son letras, con el mismo espaciado ancho del logo.

   En el logo van apilados (emblema arriba, texto abajo). Acá van uno
   al lado del otro: apilado ocuparía demasiado alto para una esquina
   y le comería aire al escenario. */
.mark{
  display:flex;
  align-items:center;
  gap:clamp(.6rem,1.1vw,.95rem);
  text-decoration:none;
  color:var(--chrome);
}

.mark__emblem{
  width:clamp(1.85rem,2.9vw,2.6rem);
  height:auto;
  flex:none;
  /* el emblema es la única pieza de marca que brilla: le sienta el
     mismo halo frío que el rig */
  filter:drop-shadow(0 0 .55rem rgba(var(--beam),.28));
  transition:filter .4s var(--ease);
}
.mark:hover .mark__emblem,
.mark:focus-visible .mark__emblem{
  filter:drop-shadow(0 0 .95rem rgba(var(--beam),.55));
}
.mark:focus-visible{ outline:2px solid rgba(var(--beam),.7); outline-offset:6px; border-radius:4px; }

.mark__type{ display:block; }
.mark__type b{
  display:block;
  font-size:clamp(.88rem,1.28vw,1.12rem);
  font-variation-settings:"wdth" 112,"wght" 500;
  letter-spacing:.3em;
  line-height:1;
}
.mark__type small{
  display:block;
  margin-top:.42rem;
  font-family:var(--mono);
  font-size:.5rem;
  font-weight:400;
  letter-spacing:.34em;
  color:var(--steel);
}
.mark__type i{ font-style:normal; color:var(--graphite); }

.menu{
  display:flex;
  gap:clamp(1rem,2.2vw,2rem);
  font-family:var(--mono);
  font-size:.6rem;
  letter-spacing:.22em;
}
.menu a{
  color:var(--steel);
  text-decoration:none;
  transition:color .35s var(--ease);
}
.menu a:hover,
.menu a:focus-visible{ color:var(--chrome); }

/* ── las cifras que flanquean al auto ──────────────────────────── */

/* Acá se reparte el peso: dos números enormes a los costados hacen
   que el ojo cruce todo el cuadro en vez de clavarse en el auto. */
.figure{
  position:absolute;
  z-index:5;
  top:44%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
}
.figure--l{ left:var(--gut); align-items:flex-start; }
.figure--r{ right:var(--gut); align-items:flex-end; }

.figure b{
  display:block;
  font-size:clamp(2.6rem,7.4vw,7.4rem);
  font-variation-settings:"wdth" 64,"wght" 700;
  letter-spacing:-.02em;
  line-height:.82;
  /* el número se apaga hacia abajo: presencia sin robarle brillo al auto */
  background:linear-gradient(176deg, var(--chrome) 6%, #5C6270 88%);
  -webkit-background-clip:text;
          background-clip:text;
  color:transparent;
}
.figure i{
  font-style:normal;
  font-family:var(--mono);
  font-size:.58rem;
  letter-spacing:.28em;
  color:var(--steel);
  margin-top:.7rem;
}
.figure .slot{ overflow:hidden; }

/* ── el pie ────────────────────────────────────────────────────── */

#foot{
  position:absolute;
  z-index:6;
  left:0; right:0;
  bottom:clamp(1.1rem,3.4vh,2.4rem);
  padding:0 var(--gut);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:clamp(.75rem,2vh,1.35rem);
}

.slot{ overflow:hidden; }
.slot > *{ display:block; will-change:transform; }

.model{
  font-size:clamp(1.35rem,3.6vw,3.1rem);
  font-variation-settings:"wdth" 108,"wght" 600;
  letter-spacing:.01em;
  line-height:1.05;
  text-align:center;
  text-transform:uppercase;
  /* nombres como "Mercedes-Benz GLC Coupé" llegan al borde en un
     teléfono: que corten parejo en vez de dejar una palabra suelta */
  text-wrap:balance;
}
.gearbox{
  font-family:var(--mono);
  font-size:.6rem;
  letter-spacing:.3em;
  color:var(--graphite);
  text-align:center;
  margin-top:.6rem;
}

/* controles: van juntos abajo, no a los costados — los costados ahora
   los ocupan las cifras */
#controls{
  display:flex;
  align-items:center;
  gap:clamp(.9rem,2.4vw,1.9rem);
}

.arrow{
  width:2.7rem; height:2.7rem;
  display:grid; place-items:center;
  border:1px solid rgba(242,244,248,.16);
  border-radius:50%;
  background:transparent;
  color:var(--steel);
  cursor:pointer;
  transition:color .3s var(--ease), border-color .3s var(--ease), background .3s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.arrow svg{ width:1rem; height:1rem; }
.arrow:hover,
.arrow:focus-visible{
  color:#000;
  background:var(--chrome);
  border-color:var(--chrome);
}
.arrow:focus-visible{ outline:2px solid rgba(var(--beam),.7); outline-offset:3px; }

#ticks{ display:flex; align-items:center; gap:.55rem; }
.tick{
  width:clamp(1.1rem,2.6vw,2.1rem);
  height:2px;
  background:rgba(242,244,248,.18);
  transition:background .45s var(--ease), box-shadow .45s var(--ease);
}
.tick.on{
  background:var(--chrome);
  box-shadow:0 0 .7rem rgba(var(--beam),.9);
}

/* ── pantallas chicas ──────────────────────────────────────────── */

/* En vertical el auto necesita subir: si el piso queda al 74% no
   entran las cifras ni el pie debajo. */
@media (orientation:portrait){
  :root{ --ground:57%; }
  /* en vertical el auto es chico: el nombre tiene que arrimarse y
     agrandarse, si no queda flotando solo arriba y no se lee */
  #word{
    top:calc(var(--ground) - clamp(3.5rem,12vh,9rem));
    font-size:clamp(3.4rem,27vw,11rem);
    color:#1E2027;
  }
}

@media (max-width:760px){
  .menu{ display:none; }
  /* las cifras bajan y se apoyan sobre la línea del piso, una a cada
     lado, en vez de flotar a media altura */
  .figure{
    top:calc(var(--ground) + clamp(2.2rem,7vh,4.5rem));
    transform:none;
  }
  .figure b{ font-size:clamp(2.4rem,13vw,3.6rem); }
  .figure i{ margin-top:.45rem; font-size:.52rem; letter-spacing:.2em; }
}

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001s !important; transition-duration:.001s !important }
}
</style>
</head>
<body>

<main id="stage">

  <!-- El rig ocupa la ventana entera, no el marco del auto. Cuando
       vivía adentro del marco, en un teléfono el marco quedaba como
       una banda en el medio y las luces se cortaban con ella. -->
  <div id="rig" aria-hidden="true">
    <div class="l-ambient"></div>
    <div class="l-cone l-cone--l"></div>
    <div class="l-cone l-cone--r"></div>
    <div class="l-reflect"></div>
    <div class="l-ember" id="ember"></div>
    <div class="l-horizon" id="horizon"></div>
    <div class="l-sweep" id="sweep"></div>
  </div>

  <div id="word" aria-hidden="true"></div>

  <div id="frame">
    <div id="deck"></div>
  </div>

  <header class="hud hud--tl">
    <a class="mark" href="/" aria-label="Manna Motors Selected — inicio">
      <!-- Emblema vectorizado del logo original. El resto de la marca
           va como texto: son letras, no hace falta trazarlas. -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  "use strict";

  const CARS = [
    { slug:'bmw-serie2', word:'SERIE 2', model:'BMW Serie 2 Coupé',
      power:374, accel:'4,3', gearbox:'AUTOMÁTICA 8V · TRACCIÓN TRASERA' },

    { slug:'camaro-ss',  word:'CAMARO',  model:'Chevrolet Camaro SS',
      power:453, accel:'4,0', gearbox:'MANUAL 6V · V8 6.2' },

    { slug:'glc-coupe',  word:'GLC',     model:'Mercedes-Benz GLC Coupé',
      power:258, accel:'6,2', gearbox:'AUTOMÁTICA 9V · 4MATIC' },

    { slug:'audi-rs3',   word:'RS 3',    model:'Audi RS 3 Sportback',
      power:400, accel:'3,8', gearbox:'S TRONIC 7V · QUATTRO' },

    { slug:'golf-gti',   word:'GTI',     model:'Volkswagen Golf GTI',
      power:245, accel:'6,2', gearbox:'DSG 7V · TRACCIÓN DELANTERA' },

    { slug:'audi-q5',    word:'Q5',      model:'Audi Q5 Sportback',
      power:265, accel:'6,1', gearbox:'S TRONIC 7V · QUATTRO' }
  ];

  const $ = id => document.getElementById(id);
  const G = window.gsap;                       // puede faltar si no hay red
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const still = !G || reduced;                 // sin animación: cambio seco

  const word = $('word'), deck = $('deck');

  /* ─────────────────────────────────────────────────────────────
     Encaje.

     El marco del auto está atado al ALTO de la ventana, así que su
     ancho no tiene nada que ver con el ancho de la pantalla: en un
     teléfono el marco es cuatro veces más ancho que el visor. Por eso
     la escala del auto no puede ser un número fijo en el CSS — hay
     que calcularla para que el auto ocupe siempre la misma porción
     del ancho disponible.

     De paso publica --carw, el ancho real del auto en pantalla, que
     es contra lo que se dimensiona la brasa del piso.
     ───────────────────────────────────────────────────────────── */
  const AR = 1672 / 941;
  const CAR_IN_FRAME = .84;        // cuánto del marco ocupa el auto, medido

  let travel = 130;                // recorrido de la cinta, en xPercent

  function fit(){
    const vw = innerWidth, vh = innerHeight;
    const frameW = vh * AR;
    const share  = vw < 760 ? .84 : .50;   // del ancho de la ventana
    const carW   = vw * share;
    const root = document.documentElement.style;
    root.setProperty('--car',  (carW / (frameW * CAR_IN_FRAME)).toFixed(4));
    root.setProperty('--carw', Math.round(carW) + 'px');

    /* Cuánto tiene que viajar el auto para salir limpio de cuadro:
       media pantalla más medio auto, más un respiro. Se expresa en
       xPercent —que es relativo al ancho del <img>, no al de la
       ventana—, y por eso hay que recalcularlo: un número fijo dejaba
       media trompa colgando en pantallas anchas. */
    travel = ((vw + carW) / 2 + 40) / (carW / CAR_IN_FRAME) * 100;
  }
  fit();
  addEventListener('resize', fit);
  addEventListener('orientationchange', fit);

  /* ── montaje ───────────────────────────────────────────────── */

  /* Huella de las fotos. La escribe tools/build-cars.py en cada corrida
     y va pegada a cada URL, así que cuando una foto cambia, cambia la
     dirección que pide el navegador.

     Sin esto no hay forma de que veas una foto nueva: el navegador tiene
     guardada la vieja bajo esa misma dirección y la muestra sin volver a
     preguntar. En Cloudflare es peor, porque además hay un CDN cacheando
     en el medio. */
  const FOTOS = 'e891cfd8';

  const imgs = CARS.map((c,i)=>{
    const el = document.createElement('img');
    el.className = 'car' + (i===0 ? ' is-on' : '');
    el.src = `assets/cars/${c.slug}.webp?v=${FOTOS}`;
    el.srcset = `assets/cars/${c.slug}@sm.webp?v=${FOTOS} 1100w, ` +
                `assets/cars/${c.slug}.webp?v=${FOTOS} 1672w, ` +
                `assets/cars/${c.slug}@2x.webp?v=${FOTOS} 3344w`;
    el.sizes = '100vw';
    el.alt = c.model;
    el.decoding = 'async';
    el.fetchPriority = i===0 ? 'high' : 'low';
    deck.appendChild(el);
    return el;
  });

  $('ticks').innerHTML = CARS.map((c,i)=>
    `<button class="tick${i===0?' on':''}" data-i="${i}" aria-label="${c.model}"></button>`
  ).join('');
  const ticks = [...document.querySelectorAll('.tick')];

  function paint(i){
    const c = CARS[i];
    word.textContent        = c.word;
    $('model').textContent  = c.model;
    $('gearbox').textContent= c.gearbox;
    $('fPower').textContent = c.power;
    $('fAccel').textContent = c.accel;
    ticks.forEach((t,k)=> t.classList.toggle('on', k===i));
  }

  let cur = 0, busy = false, queued = null;
  paint(0);

  /* ─────────────────────────────────────────────────────────────
     El cambio.

     El auto que está se va DEL LADO DE LA FLECHA que se tocó, y el
     que entra crece desde atrás, como si hubiera estado esperando en
     la penumbra detrás del primero.

     Dos reglas que no se negocian:
     · Nada se mueve en Y. Cualquier corrimiento vertical acá se lee
       como que la página se movió.
     · El rig no se desplaza NUNCA. Sólo late: la barra se apaga
       cuando el escenario queda vacío y pega un flash cuando el auto
       nuevo aterriza. Eso es lo que la hace sentir una luz de verdad
       y no un degradé pegado atrás.
     ───────────────────────────────────────────────────────────── */
  function go(dir, to){
    /* Si llega un pedido mientras la cinta corre, se guarda el último
       y se ejecuta al terminar. Sin esto, apurar las flechas se siente
       como que la página ignora los clics. */
    if (busy){
      queued = to !== undefined ? to : (cur + dir + CARS.length) % CARS.length;
      return;
    }
    const nx = to !== undefined
      ? to
      : (cur + dir + CARS.length) % CARS.length;
    if (nx === cur) return;
    const D = to !== undefined ? (nx > cur ? 1 : -1) : (dir > 0 ? 1 : -1);

    const from = imgs[cur], next = imgs[nx];
    next.classList.add('is-on');

    if (still){
      from.classList.remove('is-on');
      paint(nx); cur = nx;
      return;
    }

    busy = true;
    const T = .95;                       // dura lo mismo para los dos

    const tl = G.timeline({
      onComplete(){
        from.classList.remove('is-on');
        /* opacity va incluido a propósito: si algún tween la dejó
           escrita en línea, le ganaría a .car{opacity:0} y el auto
           seguiría visible detrás del que está en escena. */
        G.set(from, { clearProps:'transform,filter,opacity' });
        busy = false;
        if (queued !== null){ const q = queued; queued = null; go(0, q); }
      }
    });

    /* ── LA CINTA ────────────────────────────────────────────────
       Los dos autos son un solo movimiento. Arrancan juntos, viajan
       la MISMA distancia, en la MISMA dirección, con la MISMA curva
       de velocidad. Es lo que hace que se lea como una calesita y no
       como dos animaciones que casualmente coinciden.

       Nada de escala ni de desplazamiento vertical: sobre una
       carretera el auto no se acerca ni se aleja, sólo pasa.

       `travel` es cuánto hay que correrlos para que salgan limpios
       de cuadro, y lo calcula fit() según el tamaño de la ventana:
       un porcentaje fijo dejaría media trompa colgando en pantallas
       anchas. */
    G.set(next, { xPercent:-travel*D, filter:'blur(3px) brightness(.06)' });

    tl.to(from, { xPercent: travel*D, duration:T, ease:'power2.inOut' }, 0)
      .to(next, { xPercent: 0,        duration:T, ease:'power2.inOut' }, 0);

    /* El desenfoque de movimiento es simétrico y llega al máximo en
       el medio del recorrido, que es donde más rápido van. Y el
       brillo cae al salir del haz: el auto no se desvanece, se va de
       la luz. */
    tl.to(from, { keyframes:[
        { filter:'blur(8px) brightness(.72)', duration:T*.5, ease:'power1.in'  },
        { filter:'blur(3px) brightness(.05)', duration:T*.5, ease:'power1.out' }
      ]}, 0)
      .to(next, { keyframes:[
        { filter:'blur(8px) brightness(.72)', duration:T*.5, ease:'power1.in'  },
        { filter:'blur(0px) brightness(1)',   duration:T*.5, ease:'power1.out' }
      ]}, 0);

    /* ── el rig acompaña ─────────────────────────────────────────
       No se mueve: se apaga mientras el escenario está de paso y
       vuelve cuando el auto nuevo frena en el centro. */
    tl.to('#horizon', { opacity:.34, duration:T*.42, ease:'power2.inOut' }, 0)
      .to('#horizon', { opacity:1, scaleY:2.4, duration:.14, ease:'power2.out' }, T*.78)
      .to('#horizon', { scaleY:1, duration:.7, ease:'elastic.out(1,.5)' }, T*.9);

    tl.to('#ember', { opacity:.2, duration:T*.42, ease:'power2.inOut' }, 0)
      .to('#ember', { opacity:1.4, duration:.16, ease:'power2.out' }, T*.78)
      .to('#ember', { opacity:1, duration:.6 }, T*.95);

    /* el punto caliente viaja CON los autos, no en contra: es el
       reflejo del auto corriendo sobre la barra */
    tl.fromTo('#sweep',
      { xPercent: D>0 ? -90 : 430, opacity:0 },
      { xPercent: D>0 ? 430 : -90, opacity:1, duration:T, ease:'power2.inOut' }, 0)
      .to('#sweep', { opacity:0, duration:.2 }, T*.85);

    /* el cartel del fondo viaja en el mismo sentido pero más lejos:
       ese desfasaje da profundidad sin usar 3D */
    tl.to(word, { xPercent:-50 + 46*D, opacity:0, duration:T*.45, ease:'power2.in' }, 0)
      .add(()=>paint(nx), T*.46)
      .fromTo(word,
        { xPercent:-50 - 46*D, opacity:0 },
        { xPercent:-50, opacity:1, duration:T*.62, ease:'power2.out' }, T*.46);

    /* las cifras y el nombre se recomponen desde su ventanita */
    tl.to('.slot > *', { yPercent:-115, duration:T*.3, ease:'power2.in', stagger:.03 }, 0)
      .fromTo('.slot > *', { yPercent:115 },
        { yPercent:0, duration:T*.6, ease:'power3.out', stagger:.045 }, T*.48);

    tl.to('#gearbox', { opacity:0, duration:T*.28, ease:'power2.in' }, 0)
      .to('#gearbox', { opacity:1, duration:T*.5 }, T*.5);

    cur = nx;
  }

  /* ── controles ─────────────────────────────────────────────── */

  $('next').addEventListener('click', ()=>go(1));
  $('prev').addEventListener('click', ()=>go(-1));
  ticks.forEach(t => t.addEventListener('click', ()=>go(0, +t.dataset.i)));

  addEventListener('keydown', e=>{
    if (e.key === 'ArrowRight'){ e.preventDefault(); go(1); }
    if (e.key === 'ArrowLeft'){  e.preventDefault(); go(-1); }
  });

  let sx = null, sy = null;
  const stage = $('stage');
  stage.addEventListener('pointerdown', e=>{ sx = e.clientX; sy = e.clientY; });
  stage.addEventListener('pointerup', e=>{
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    sx = null;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
  });

  /* ── vida propia: el rig respira aunque nadie toque nada ────── */

  if (!still){
    G.to('.l-cone--l', { opacity:.32, duration:5.5, yoyo:true, repeat:-1, ease:'sine.inOut' });
    G.to('.l-cone--r', { opacity:.32, duration:6.8, yoyo:true, repeat:-1, ease:'sine.inOut', delay:.9 });
    G.set('#sweep', { opacity:0 });

    G.timeline({ defaults:{ ease:'power3.out' } })
      .from('.l-ambient', { opacity:0, duration:1.3 })
      .from('#horizon',   { scaleX:0, duration:1.15, ease:'power4.out' }, .15)
      .from('.l-reflect, .l-ember', { opacity:0, duration:.9 }, .5)
      .from('.l-cone',    { opacity:0, duration:1.1 }, .5)
      /* clearProps no es opcional acá. `from` deja el valor final
         escrito en el atributo style, y un opacity:1 en línea le gana
         a la regla .car{opacity:0}: el primer auto no se apagaba nunca
         y quedaba asomando detrás de todos los demás. */
      .from(imgs[0],      { opacity:0, scale:1.07, filter:'blur(14px)', duration:1.2,
                            clearProps:'opacity,transform,filter' }, .45)
      .from(word,         { opacity:0, scale:1.06, duration:1 }, .6)
      .from('.hud--tl, .hud--tr', { opacity:0, y:-12, duration:.6, stagger:.08 }, .7)
      .from('.slot > *',  { yPercent:115, duration:.75, stagger:.06 }, .8)
      .from('#gearbox, #controls', { opacity:0, y:10, duration:.6, stagger:.08 }, 1);
  }
})();
</script>
</body>
</html>
