     LAS ETIQUETAS og: SON LAS QUE USA WHATSAPP. Cuando alguien pega el

     LA FOTO ES ABSOLUTA Y NO RELATIVA: quien lee estas etiquetas esta en

<!-- El mismo pie que la home, desde la misma hoja. El marcado está
     duplicado abajo (idéntico, con rutas absolutas); el CSS no. -->
<link rel="stylesheet" href="/barra.css">
<link rel="stylesheet" href="/pie.css">
<style>
/* Los mismos tokens que index.html. No se comparte una hoja porque el
   sitio entero vive en un solo archivo y partirlo ahora seria un cambio
   mas grande que esta pagina. Si algun dia se separa el CSS, este bloque
   es lo primero que se va. */
:root{
  --void:#000; --chrome:#fff; --hueso:#F4F1EA; --gris:#D1D5DB;
  --linea:rgba(255,255,255,.14);
  --apagado:rgba(255,255,255,.6);
  --beam:214,232,255;
  --display:"Syncopate",ui-sans-serif,system-ui,sans-serif;
  --texto:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --gut:clamp(1.6rem,4.4vw,4.5rem);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar{display:none}
body{
  background:var(--void); color:var(--chrome);
  font-family:var(--texto); -webkit-font-smoothing:antialiased;
  min-height:100svh;
  /* Le deja el lugar a la barra, que salió del flujo al hacerse fija. */
  padding-top:var(--barra-h,4.6rem);
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

/* La misma luz de ambiente del sitio, con las mismas medidas. */
#ambiente{
  position:fixed; inset:0; z-index:40; pointer-events:none;
  mix-blend-mode:screen;
  background:
    radial-gradient(92% 68% at 14% 10%, rgba(var(--beam),.055), transparent 72%),
    radial-gradient(86% 66% at 88% 84%, rgba(var(--beam),.05), transparent 70%),
    radial-gradient(150% 70% at 50% 114%, rgba(var(--beam),.055), transparent 64%);
}
@media (max-width:767px){
  #ambiente{ background:radial-gradient(160% 55% at 50% 112%, rgba(var(--beam),.06), transparent 66%) }
}

.rotulo{
  font-family:var(--texto); font-size:.58rem; font-weight:600;
  letter-spacing:.26em; text-transform:uppercase; color:var(--apagado);
}

/* ── encabezado ── */
.tapa{ padding:clamp(2.6rem,7vh,4.5rem) var(--gut) clamp(1.4rem,3vh,2rem); text-align:center }
.tapa h1{
  font-family:var(--display); font-weight:700; text-transform:uppercase;
  font-size:clamp(1.1rem,3vw,1.9rem); letter-spacing:.06em;
  margin-top:clamp(.8rem,2vh,1.2rem);
}
.tapa p{
  margin:clamp(.9rem,2vh,1.3rem) auto 0; max-width:34rem;
  font-size:clamp(.88rem,1.15vw,.98rem); line-height:1.75; color:var(--apagado);
}

/* ── filtros ── */
.filtros{
  display:flex; flex-wrap:wrap; justify-content:center; gap:.45rem;
  padding:0 var(--gut) clamp(1.8rem,4vh,2.6rem);
}
.chip{
  appearance:none; cursor:pointer; font-family:inherit;
  border:1px solid var(--linea); border-radius:100px; background:transparent;
  color:var(--apagado); padding:.55em 1.15em;
  font-size:.56rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  transition:color .3s var(--ease), border-color .3s var(--ease), background .3s var(--ease);
}
.chip:hover{ color:var(--chrome); border-color:rgba(255,255,255,.4) }
.chip[aria-pressed="true"]{ background:var(--chrome); color:var(--void); border-color:var(--chrome) }

/* ── grilla ── */
.grilla{
  display:grid; gap:clamp(.8rem,1.6vw,1.4rem);
  grid-template-columns:repeat(auto-fill,minmax(min(20rem,100%),1fr));
  padding:0 var(--gut) clamp(4rem,10vh,7rem);
  max-width:88rem; margin:0 auto;
}
.auto{
  border:1px solid var(--linea); border-radius:3px; overflow:hidden;
  background:#08080a; display:flex; flex-direction:column;
  transition:border-color .4s var(--ease), transform .4s var(--ease);
}
.auto:hover{ border-color:rgba(255,255,255,.34); transform:translateY(-3px) }
.auto .lente{ aspect-ratio:16/10; overflow:hidden; background:#0b0b0d; position:relative }
.auto .lente img{ width:100%; height:100%; object-fit:cover; transition:transform .8s var(--ease) }
.auto:hover .lente img{ transform:scale(1.05) }
.auto .sinfoto{
  position:absolute; inset:0; display:grid; place-content:center;
  color:rgba(255,255,255,.18); font-size:.58rem; letter-spacing:.2em; text-transform:uppercase;
}
.auto .cuerpo{ padding:1.1rem 1.2rem 1.3rem; display:grid; gap:.45rem }
.auto h2{ font-size:1rem; font-weight:600; line-height:1.35 }
.auto .ficha{ font-size:.76rem; color:var(--apagado) }
.auto .precio{
  margin-top:.35rem; font-family:var(--display); font-size:.82rem;
  font-weight:700; letter-spacing:.04em;
}
.vacio{ padding:5rem var(--gut); text-align:center; color:var(--apagado); grid-column:1/-1 }

/* ── EL DETALLE, EN UNA SOLA PANTALLA ──────────────────────────────

   La foto a la izquierda y la ficha a la derecha. Antes la foto ocupaba
   el ancho completo y todo lo demás caía debajo, así que ver el precio
   pedía scrollear: la pieza medía dos pantallas para mostrar ocho datos.

   LA ALTURA MANDA, Y ESO INVIERTE COMO SE MIDE LA FOTO. Con
   `aspect-ratio` el alto sale del ancho, y el ancho de una columna puede
   dar una foto más alta que la ventana. Acá la caja se topa contra el
   alto de la ventana y la foto toma lo que sobra —`flex:1` con
   `min-height:0`, que es lo que la deja encogerse— así que el conjunto
   nunca pasa de una pantalla, sea cual sea la proporción de la foto.

   `min-height:0` no es adorno: por omisión un hijo de flex no baja de su
   contenido, y sin eso la foto empuja la caja y vuelve a desbordar. */
.detalle{
  position:fixed; inset:0; z-index:60;
  background:rgba(0,0,0,.97); backdrop-filter:blur(10px);
  /* `minmax(0,1fr)` Y NO UNA COLUMNA `auto`. Sin esto la columna se
     mide por el contenido, y como el botón de consultar es una frase
     larga con mucho espaciado de letra, la caja pedía 524 px adentro de
     una pantalla de 375: todo el detalle se salía por la derecha y el
     cerrar quedaba fuera de la pantalla. Con el mínimo en 0 la columna
     no puede pasarse del ancho disponible. */
  display:grid; grid-template-columns:minmax(0,1fr);
  align-items:stretch; justify-items:center;
  padding:clamp(.9rem,2.6vw,2rem);
  /* Arranca debajo de la barra, que ahora queda encima. */
  padding-top:calc(var(--barra-h,4.6rem) + clamp(.9rem,2.6vw,2rem));
}
.detalle[hidden]{ display:none }

/* ESTIRA HASTA EL ALTO DISPONIBLE en vez de quedar centrada.

   Con `place-items:center` la caja medía lo que medía la columna de
   datos y el resto quedaba como aire arriba y abajo: unos 110 px de cada
   lado en una pantalla de escritorio, con el botón de cerrar flotando
   solo en la banda de arriba. Estirando, ese lugar se lo lleva la foto,
   que es lo que alguien vino a mirar. */
.detalle .caja{
  width:100%; max-width:80rem;
  min-width:0;
  height:100%;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:clamp(1rem,2.4vw,2.2rem);
  min-height:0;
}

/* `min-width:0` en las dos columnas por lo mismo que arriba: un hijo de
   grilla no baja de su contenido si no se lo pide. */
.lado-foto{ display:flex; flex-direction:column; gap:.55rem; min-height:0; min-width:0 }
.lado-foto .grande{
  position:relative;
  flex:1 1 auto; min-height:0;
  overflow:hidden; border-radius:3px; background:#0b0b0d;
}
.lado-foto .grande img{ width:100%; height:100%; object-fit:cover }

.tiras{ flex:0 0 auto; display:flex; gap:.45rem; overflow-x:auto; padding-bottom:.2rem }
.tiras img{
  height:4.2rem; aspect-ratio:16/10; object-fit:cover; border-radius:2px;
  border:1px solid transparent; cursor:pointer; opacity:.5;
  transition:opacity .3s var(--ease), border-color .3s var(--ease); flex:0 0 auto;
}
.tiras img[aria-current="true"]{ opacity:1; border-color:var(--chrome) }

/* LA QUE SCROLLEA ES LA DESCRIPCIÓN, NO LA FICHA ENTERA.

   Antes el scroll estaba acá y con una descripción larga se iban de
   pantalla el título y los datos —y el botón de consultar, que es lo que
   no puede irse—. Ahora la ficha queda quieta y el que se mueve es el
   párrafo. */
.lado-datos{
  display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden;
}
.detalle h2{
  font-family:var(--display); font-size:clamp(.95rem,1.9vw,1.35rem);
  font-weight:700; text-transform:uppercase; letter-spacing:.05em; line-height:1.4;
}
.datos{
  display:grid; gap:.9rem 1.4rem; margin-top:1.4rem;
  grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));
}
.datos div span{ display:block }
.datos .valor{ font-size:.88rem; margin-top:.2rem }
/* EL RÓTULO PEGADO A SU TEXTO Y SEPARADO DE LA GRILLA.

   Estaba justo al revés: sin margen arriba, así que "Descripción" quedaba
   pisando la fila de Línea y Precio como si fuera un dato más de la
   grilla, y con 1.4rem entre el rótulo y el párrafo, que lo dejaba
   flotando lejos de lo que nombra. Un rótulo pertenece a lo que tiene
   abajo, no a lo que tiene arriba.

   TOMA EL LUGAR QUE SOBRA Y SCROLLEA ADENTRO: `flex:1 1 0` con
   `min-height:0`, que es lo que le permite ser más chica que su texto. */
.bloque-desc{
  margin-top:2.2rem;
  flex:1 1 0; min-height:0;
  display:flex; flex-direction:column;
}
.bloque-desc .rotulo{ display:block; flex:0 0 auto }
.desc{
  margin-top:.55rem; line-height:1.75; font-size:.85rem;
  /* Una palabra sin espacios más ancha que la columna —una patente, una
     dirección web, o alguien escribiendo de corrido— se sale por el
     costado en vez de cortarse. `anywhere` la parte donde haga falta;
     el `break-word` es el respaldo para los que no lo entienden. */
  overflow-wrap:break-word;
  overflow-wrap:anywhere;
  /* En blanco, como los valores de la grilla: es contenido, no un pie de
     foto. En gris se leía como una aclaración de segunda. */
  color:var(--chrome); white-space:pre-line;
  flex:1 1 auto; min-height:0; overflow:auto;
  padding-right:.4rem;
}
.consultar{
  display:block; text-align:center; margin-top:1.6rem; flex:0 0 auto; padding:1em 2em;
  border:1px solid var(--chrome); border-radius:2px; background:var(--chrome); color:var(--void);
  font-family:var(--display); font-size:.58rem; font-weight:700;
  letter-spacing:.18em; text-transform:uppercase;
  transition:background .35s var(--ease), color .35s var(--ease);
}
.consultar:hover{ background:transparent; color:var(--chrome) }

/* VOLVER ES UNA FLECHA, NO UNA CRUZ.

   Estuvo como cruz arriba a la derecha y no se entendía: una cruz dice
   "cerrar esto", que en una ficha abierta adentro del listado no es lo
   que pasa — se vuelve al listado. Una flecha para atrás, arriba a la
   izquierda, es el gesto que ya significa eso en cualquier teléfono.

   VA DEL LADO OPUESTO A LA DE PASAR FOTOS y con un dibujo distinto: la
   de volver es una flecha con cola, las de la galería son cabezas de
   flecha solas y están a media altura. Puestas iguales se confundirían.

   Todas son redondas y del mismo tamaño para que se lean como los
   controles de la foto y no como botones sueltos. */
.cerrar,
.paso{
  position:absolute; z-index:2;
  display:grid; place-items:center;
  width:2.4rem; height:2.4rem;
  appearance:none; border:1px solid var(--linea); border-radius:100px;
  background:rgba(0,0,0,.55); backdrop-filter:blur(8px);
  color:var(--chrome); cursor:pointer;
  transition:background .3s var(--ease), border-color .3s var(--ease);
}
.cerrar svg,
.paso svg{ width:1.05rem; height:1.05rem }
.cerrar{ top:.7rem; left:.7rem }
.paso{ top:50%; transform:translateY(-50%) }
.paso--antes{ left:.7rem }
.paso--luego{ right:.7rem }

@media (hover:hover){
  .cerrar:hover,
  .paso:hover{ background:rgba(0,0,0,.8); border-color:rgba(255,255,255,.55) }
}

/* ── LAS FOTOS EN GRANDE ──────────────────────────────────────────

   `touch-action:none` es lo que hace que funcione: sin eso el navegador
   se queda con los dos dedos para agrandar la página entera y este
   código no llega a ver un solo evento.

   `transform-origin:center` porque toda la cuenta del acercamiento en
   garage.js está escrita con el origen en el centro. */
.zoom{
  position:fixed; inset:0; z-index:80;
  background:#000;
  overflow:hidden;
  touch-action:none;
  user-select:none; -webkit-user-select:none;
}
.zoom[hidden]{ display:none }

/* UNA FILA CON TODAS LAS FOTOS, cada una del ancho de la pantalla, que
   se corre con translateX. La alternativa —cambiarle el `src` a una sola
   imagen— no deja arrastrar: no hay nada que se mueva con el dedo, y el
   cambio aparece de golpe. */
.zoom-tira{ display:flex; height:100%; will-change:transform }
.zoom-hoja{
  flex:0 0 100%;
  display:grid; place-items:center;
  overflow:hidden;
}
.zoom-hoja img{
  max-width:100%; max-height:100%;
  transform-origin:center;
  will-change:transform;
  -webkit-user-drag:none;
}
/* Ya acercada, el dedo arrastra la foto; de lejos, arrastra la tira. */
.zoom.cerca{ cursor:grab }

.zoom-paso{
  position:absolute; top:50%; transform:translateY(-50%); z-index:1;
  display:grid; place-items:center;
  width:2.4rem; height:2.4rem;
  appearance:none; border:1px solid var(--linea); border-radius:100px;
  background:rgba(0,0,0,.55); backdrop-filter:blur(8px);
  color:var(--chrome); cursor:pointer;
}
.zoom-paso[hidden]{ display:none }
.zoom-paso svg{ width:1.05rem; height:1.05rem }
.zoom-paso--antes{ left:.9rem }
.zoom-paso--luego{ right:.9rem }

/* EL CONTADOR NO ES DECORACIÓN: es lo que avisa que hay más fotos. Sin
   él, en una pantalla sin flechas visibles, nadie tiene por qué saber
   que el dedo hace algo. */
.zoom-cuenta{
  position:absolute; left:50%; bottom:1.1rem; transform:translateX(-50%); z-index:1;
  font-family:var(--mono,inherit); font-size:.6rem; letter-spacing:.14em;
  color:var(--chrome);
  background:rgba(0,0,0,.55); backdrop-filter:blur(8px);
  border:1px solid var(--linea); border-radius:100px;
  padding:.45em 1em;
  font-variant-numeric:tabular-nums;
}
.zoom-cuenta[hidden]{ display:none }

/* Con el dedo las flechas sobran: se pasa arrastrando, y encima tapan
   foto en la pantalla donde menos sobra. */
@media (pointer:coarse){
  .zoom-paso{ display:none }
}
.zoom-salir{
  position:absolute; top:.9rem; right:.9rem; z-index:1;
  display:grid; place-items:center;
  width:2.4rem; height:2.4rem;
  appearance:none; border:1px solid var(--linea); border-radius:100px;
  background:rgba(0,0,0,.55); backdrop-filter:blur(8px);
  color:var(--chrome); cursor:pointer;
}
.zoom-salir svg{ width:1.05rem; height:1.05rem }

/* La foto de la ficha avisa que se puede abrir. */
.lado-foto .grande img{ cursor:zoom-in }

/* EN EL TELEFONO NO HAY DOS COLUMNAS QUE VALGAN: 380 px partidos al
   medio no alcanzan para ninguna de las dos. Se apila y se scrollea, que
   es lo que corresponde ahí. */
@media (max-width:820px){
  /* En vertical manda el scroll de la página, no el de la descripción:
     con la ficha apilada debajo de la foto hay lugar de sobra para
     abajo, y un párrafo con scroll propio adentro de una página que
     también scrollea es una trampa. */
  /* AIRE DEBAJO DEL BOTON. Apilado, "Consultar por esta unidad" es lo
     ultimo de la ficha, y con el relleno de 14 px que traia la capa la
     pagina terminaba justo donde termina el boton: se lee como si
     estuviera cortada, y en un telefono el dedo queda encima del borde
     de la pantalla justo cuando va a tocarlo. */
  .detalle{
    align-items:start;
    overflow:auto;
    padding-bottom:clamp(2.5rem,7vh,4rem);
  }
  .detalle .caja{ grid-template-columns:1fr; height:auto; max-height:none }
  .lado-datos{ overflow:visible }
  .bloque-desc{ flex:0 0 auto }
  .desc{ overflow:visible; padding-right:0 }
  .lado-foto .grande{ aspect-ratio:16/10; flex:0 0 auto }
  .lado-datos{ overflow:visible }
  /* EL BOTON VA AL FINAL, DEBAJO DE LA DESCRIPCION.

     Estuvo arriba, pegado a las fotos, con la idea de que consultar no
     obligara a recorrer la ficha entera. Pero ahi parte la lectura al
     medio: se ven las fotos, aparece un boton, y recien despues el
     nombre del auto, el precio y la descripcion. Se pide antes de haber
     contado que es lo que se ofrece.

     Al final es donde cae naturalmente: primero las fotos y los datos,
     y cuando alguien termino de leer, el boton. Es el mismo orden que
     en escritorio, asi que ya no hace falta el `order`. */
  .consultar{ margin-top:1.8rem }
  .bloque-desc{ margin-top:1.8rem }
}
</style>
</head>
<body>

<header class="barra">
  <a class="marca" href="/" aria-label="Manna Motors Selected — inicio">
    <img src="/assets/logo/logo-horizontal-blanco.svg" alt="Manna Motors Selected">
  </a>
  <nav>
    <a href="/">Inicio</a>
    <a href="/por-que-elegirnos/">Por qué elegirnos</a>
    <!-- AL PIE Y NO AL FORMULARIO DE LA HOME. Los datos de contacto
         —telefono, mail, direccion y mapa— estan abajo de esta misma
         pagina; mandar a otra pagina a alguien que ya esta mirando el
         catalogo es hacerle perder lo que estaba viendo. -->
    <a href="#pie">Contacto</a>
  </nav>
  <button class="quema" type="button" aria-label="Abrir menu" aria-expanded="false">
    <span></span><span></span>
  </button>

</header>

<section class="tapa">
  <span class="rotulo">El garage</span>
  <h1>Unidades seleccionadas</h1>
</section>

<div class="filtros" id="filtros"></div>
<div class="grilla" id="grilla"></div>

<div class="detalle" id="detalle" hidden></div>

<!-- LAS FOTOS EN GRANDE. La cáscara vive en el HTML porque es siempre
     la misma; lo único que cambia son las hojas de adentro, una por
     foto, que las pone el script. -->
<div class="zoom" id="zoom" hidden>
  <div class="zoom-tira"></div>

  <button class="zoom-paso zoom-paso--antes" type="button" data-paso="-1" aria-label="Foto anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
  </button>
  <button class="zoom-paso zoom-paso--luego" type="button" data-paso="1" aria-label="Foto siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
