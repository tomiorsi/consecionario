<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage — Manna Motors Selected</title>
<meta name="description" content="Las unidades seleccionadas de Manna Motors. Cada auto, revisado y documentado antes de publicarse.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Montserrat:wght@300..800&display=swap" rel="stylesheet">
<style>
/* Los mismos tokens que index.html. No se comparte una hoja porque el
   sitio entero vive en un solo archivo y partirlo ahora seria un cambio
   mas grande que esta pagina. Si algun dia se separa el CSS, este bloque
   es lo primero que se va. */
:root{
  --void:#000; --chrome:#fff; --hueso:#F4F1EA; --gris:#D1D5DB;
  --linea:rgba(255,255,255,.14);
  --apagado:rgba(255,255,255,.6);
  --beam:214,232,255;
  --display:"Syncopate",ui-sans-serif,system-ui,sans-serif;
  --texto:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --gut:clamp(1.6rem,4.4vw,4.5rem);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar{display:none}
body{
  background:var(--void); color:var(--chrome);
  font-family:var(--texto); -webkit-font-smoothing:antialiased;
  min-height:100svh;
  /* Le deja el lugar a la barra, que salió del flujo al hacerse fija. */
  padding-top:var(--barra-h,4.6rem);
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

/* La misma luz de ambiente del sitio, con las mismas medidas. */
#ambiente{
  position:fixed; inset:0; z-index:40; pointer-events:none;
  mix-blend-mode:screen;
  background:
    radial-gradient(92% 68% at 14% 10%, rgba(var(--beam),.055), transparent 72%),
    radial-gradient(86% 66% at 88% 84%, rgba(var(--beam),.05), transparent 70%),
    radial-gradient(150% 70% at 50% 114%, rgba(var(--beam),.055), transparent 64%);
}
@media (max-width:767px){
  #ambiente{ background:radial-gradient(160% 55% at 50% 112%, rgba(var(--beam),.06), transparent 66%) }
}

.rotulo{
  font-family:var(--texto); font-size:.58rem; font-weight:600;
  letter-spacing:.26em; text-transform:uppercase; color:var(--apagado);
}

/* ── barra ──────────────────────────────────────────────────────
   FIJA Y POR ENCIMA DEL DETALLE. Era sticky en z-index 50 y el detalle
   va en 60, así que al abrir un auto la barra desaparecía: el logo y la
   navegación quedaban tapados y no había cómo volver sin cerrar.

   Fija —y no sticky— porque cuando el detalle está abierto el body no
   scrollea, y una barra sticky se queda donde la dejó el scroll: si uno
   abrió un auto desde el fondo de la grilla, la barra estaría fuera de
   la pantalla.

   El alto lo mide el script y lo escribe en --barra-h. No se pone a mano
   porque depende del logo, del relleno y del corte de pantalla, y si se
   pone un número fijo el contenido queda tapado o flotando. */
.barra{
  position:fixed; top:0; left:0; right:0; z-index:70;
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:1.1rem var(--gut);

  /* ARRANCA TRANSPARENTE Y EL VIDRIO APARECE AL BAJAR, igual que en la
     home. Arriba de todo no hay nada que separar —el contenido recién
     empieza— y una barra opaca sobre el negro se lee como una franja
     pegada encima. */
  background:transparent;
  backdrop-filter:blur(0px);
  -webkit-backdrop-filter:blur(0px);

  /* SIN LÍNEA, SE DESVANECE. Misma pieza que en la home y por el mismo
     motivo: la máscara va acá y no en el `background` porque tiene que
     enmascarar TODO el elemento, el color Y el desenfoque juntos. Si
     sólo se difuminara el color, el corte del `backdrop-filter` seguiría
     dibujando una línea nítida donde termina la barra — justo lo que se
     quiere evitar. */
  -webkit-mask-image:linear-gradient(180deg, #000 42%, rgba(0,0,0,.55) 74%, transparent 100%);
          mask-image:linear-gradient(180deg, #000 42%, rgba(0,0,0,.55) 74%, transparent 100%);

  transition:background .45s var(--ease),
             backdrop-filter .45s var(--ease), -webkit-backdrop-filter .45s var(--ease);
}

/* Los mismos valores que usa la home cuando el fondo es oscuro. */
.barra.con-vidrio{
  background:linear-gradient(180deg, rgba(6,7,9,.82), rgba(6,7,9,.30));
  backdrop-filter:blur(16px) saturate(1.15);
  -webkit-backdrop-filter:blur(16px) saturate(1.15);
}

@media (prefers-reduced-motion:reduce){
  .barra{ transition:none }
}
.barra .marca img{ height:clamp(1.7rem,2.6vw,2.3rem); width:auto }
.barra nav{ display:flex; gap:clamp(1rem,2.4vw,2.2rem) }
.barra nav a{
  font-size:.6rem; font-weight:400; letter-spacing:.24em;
  text-transform:uppercase; color:var(--gris);
  transition:color .35s var(--ease);
}
.barra nav a:hover{ color:var(--chrome) }

/* ── encabezado ── */
.tapa{ padding:clamp(2.6rem,7vh,4.5rem) var(--gut) clamp(1.4rem,3vh,2rem); text-align:center }
.tapa h1{
  font-family:var(--display); font-weight:700; text-transform:uppercase;
  font-size:clamp(1.1rem,3vw,1.9rem); letter-spacing:.06em;
  margin-top:clamp(.8rem,2vh,1.2rem);
}
.tapa p{
  margin:clamp(.9rem,2vh,1.3rem) auto 0; max-width:34rem;
  font-size:clamp(.88rem,1.15vw,.98rem); line-height:1.75; color:var(--apagado);
}

/* ── filtros ── */
.filtros{
  display:flex; flex-wrap:wrap; justify-content:center; gap:.45rem;
  padding:0 var(--gut) clamp(1.8rem,4vh,2.6rem);
}
.chip{
  appearance:none; cursor:pointer; font-family:inherit;
  border:1px solid var(--linea); border-radius:100px; background:transparent;
  color:var(--apagado); padding:.55em 1.15em;
  font-size:.56rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  transition:color .3s var(--ease), border-color .3s var(--ease), background .3s var(--ease);
}
.chip:hover{ color:var(--chrome); border-color:rgba(255,255,255,.4) }
.chip[aria-pressed="true"]{ background:var(--chrome); color:var(--void); border-color:var(--chrome) }

/* ── grilla ── */
.grilla{
  display:grid; gap:clamp(.8rem,1.6vw,1.4rem);
  grid-template-columns:repeat(auto-fill,minmax(min(20rem,100%),1fr));
  padding:0 var(--gut) clamp(4rem,10vh,7rem);
  max-width:88rem; margin:0 auto;
}
.auto{
  border:1px solid var(--linea); border-radius:3px; overflow:hidden;
  background:#08080a; display:flex; flex-direction:column;
  transition:border-color .4s var(--ease), transform .4s var(--ease);
}
.auto:hover{ border-color:rgba(255,255,255,.34); transform:translateY(-3px) }
.auto .lente{ aspect-ratio:16/10; overflow:hidden; background:#0b0b0d; position:relative }
.auto .lente img{ width:100%; height:100%; object-fit:cover; transition:transform .8s var(--ease) }
.auto:hover .lente img{ transform:scale(1.05) }
.auto .sinfoto{
  position:absolute; inset:0; display:grid; place-content:center;
  color:rgba(255,255,255,.18); font-size:.58rem; letter-spacing:.2em; text-transform:uppercase;
}
.auto .cuerpo{ padding:1.1rem 1.2rem 1.3rem; display:grid; gap:.45rem }
.auto h2{ font-size:1rem; font-weight:600; line-height:1.35 }
.auto .ficha{ font-size:.76rem; color:var(--apagado) }
.auto .precio{
  margin-top:.35rem; font-family:var(--display); font-size:.82rem;
  font-weight:700; letter-spacing:.04em;
}
.cinta{
  position:absolute; left:.7rem; top:.7rem; z-index:1;
  background:var(--chrome); color:var(--void);
  font-size:.48rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  padding:.35em .75em; border-radius:100px;
}

.vacio{ padding:5rem var(--gut); text-align:center; color:var(--apagado); grid-column:1/-1 }

/* ── EL DETALLE, EN UNA SOLA PANTALLA ──────────────────────────────

   La foto a la izquierda y la ficha a la derecha. Antes la foto ocupaba
   el ancho completo y todo lo demás caía debajo, así que ver el precio
   pedía scrollear: la pieza medía dos pantallas para mostrar ocho datos.

   LA ALTURA MANDA, Y ESO INVIERTE COMO SE MIDE LA FOTO. Con
   `aspect-ratio` el alto sale del ancho, y el ancho de una columna puede
   dar una foto más alta que la ventana. Acá la caja se topa contra el
   alto de la ventana y la foto toma lo que sobra —`flex:1` con
   `min-height:0`, que es lo que la deja encogerse— así que el conjunto
   nunca pasa de una pantalla, sea cual sea la proporción de la foto.

   `min-height:0` no es adorno: por omisión un hijo de flex no baja de su
   contenido, y sin eso la foto empuja la caja y vuelve a desbordar. */
.detalle{
  position:fixed; inset:0; z-index:60;
  background:rgba(0,0,0,.97); backdrop-filter:blur(10px);
  display:grid; place-items:center;
  padding:clamp(.9rem,2.6vw,2rem);
  /* Arranca debajo de la barra, que ahora queda encima. */
  padding-top:calc(var(--barra-h,4.6rem) + clamp(.9rem,2.6vw,2rem));
}
.detalle[hidden]{ display:none }

.detalle .caja{
  width:min(80rem,100%);
  max-height:100%;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:clamp(1rem,2.4vw,2.2rem);
  min-height:0;
}

.lado-foto{ display:flex; flex-direction:column; gap:.55rem; min-height:0 }
.lado-foto .grande{
  flex:1 1 auto; min-height:0;
  overflow:hidden; border-radius:3px; background:#0b0b0d;
}
.lado-foto .grande img{ width:100%; height:100%; object-fit:cover }

.tiras{ flex:0 0 auto; display:flex; gap:.45rem; overflow-x:auto; padding-bottom:.2rem }
.tiras img{
  height:4.2rem; aspect-ratio:16/10; object-fit:cover; border-radius:2px;
  border:1px solid transparent; cursor:pointer; opacity:.5;
  transition:opacity .3s var(--ease), border-color .3s var(--ease); flex:0 0 auto;
}
.tiras img[aria-current="true"]{ opacity:1; border-color:var(--chrome) }

/* La ficha scrollea sola si la descripción es larga, en vez de estirar
   la caja y sacar la foto de la pantalla. */
.lado-datos{
  display:flex; flex-direction:column; min-height:0; overflow:auto;
  padding-right:.3rem;
}
.detalle h2{
  font-family:var(--display); font-size:clamp(.95rem,1.9vw,1.35rem);
  font-weight:700; text-transform:uppercase; letter-spacing:.05em; line-height:1.4;
}
.datos{
  display:grid; gap:.9rem 1.4rem; margin-top:1.4rem;
  grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));
}
.datos div span{ display:block }
.datos .valor{ font-size:.88rem; margin-top:.2rem }
.desc{
  margin-top:1.4rem; line-height:1.75; font-size:.85rem;
  color:var(--apagado); white-space:pre-line;
}
.consultar{
  display:block; text-align:center; margin-top:auto; padding:1em 2em;
  border:1px solid var(--chrome); border-radius:2px; background:var(--chrome); color:var(--void);
  font-family:var(--display); font-size:.58rem; font-weight:700;
  letter-spacing:.18em; text-transform:uppercase;
  transition:background .35s var(--ease), color .35s var(--ease);
}
.consultar:hover{ background:transparent; color:var(--chrome) }

/* El cerrar va fijo en la esquina y no en la fila del título: en la caja
   le robaba ancho justo a la columna más angosta. */
.cerrar{
  position:fixed; z-index:71;
  top:calc(var(--barra-h,4.6rem) + .7rem);
  right:clamp(.9rem,2.6vw,2rem);
  appearance:none; border:1px solid var(--linea); border-radius:2px;
  background:rgba(0,0,0,.6); backdrop-filter:blur(8px);
  color:var(--chrome); cursor:pointer; font-family:inherit;
  padding:.6em 1.1em; font-size:.56rem; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase;
}
.cerrar:hover{ border-color:rgba(255,255,255,.5) }

/* EN EL TELEFONO NO HAY DOS COLUMNAS QUE VALGAN: 380 px partidos al
   medio no alcanzan para ninguna de las dos. Se apila y se scrollea, que
   es lo que corresponde ahí. */
@media (max-width:820px){
  .detalle{ place-items:start; overflow:auto }
  .detalle .caja{ grid-template-columns:1fr; max-height:none; padding-top:2.6rem }
  .lado-foto .grande{ aspect-ratio:16/10; flex:0 0 auto }
  .lado-datos{ overflow:visible }
  /* EL BOTON VA ARRIBA, PEGADO A LAS FOTOS. Apilado queda al final de
     una columna larga, y para consultar hay que pasar por toda la ficha.
     `order` lo sube sin mover nada en el HTML, que en escritorio lo
     necesita al final de la columna. */
  .consultar{ order:-1; margin-top:0; margin-bottom:.4rem }
  .bloque-desc{ margin-top:1.4rem }
}
</style>
</head>
<body>

<header class="barra">
  <a class="marca" href="/" aria-label="Manna Motors Selected — inicio">
    <img src="/assets/logo/logo-horizontal-blanco.svg" alt="Manna Motors Selected">
  </a>
  <nav>
    <a href="/">Inicio</a>
    <a href="/#estandar">Estándar</a>
    <a href="/#concierge">Contacto</a>
  </nav>
</header>

<section class="tapa">
  <span class="rotulo">El garage</span>
  <h1>Unidades seleccionadas</h1>
</section>

<div class="filtros" id="filtros"></div>
<div class="grilla" id="grilla"></div>

<div class="detalle" id="detalle" hidden></div>
<div id="ambiente" aria-hidden="true"></div>

<script src="/garage/garage.js"></script>
</body>
</html>
