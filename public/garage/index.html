<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage — Manna Motors Selected</title>
<meta name="description" content="Las unidades seleccionadas de Manna Motors. Cada auto, revisado y documentado antes de publicarse.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Montserrat:wght@300..800&display=swap" rel="stylesheet">
<style>
/* Los mismos tokens que index.html. No se comparte una hoja porque el
   sitio entero vive en un solo archivo y partirlo ahora seria un cambio
   mas grande que esta pagina. Si algun dia se separa el CSS, este bloque
   es lo primero que se va. */
:root{
  --void:#000; --chrome:#fff; --hueso:#F4F1EA; --gris:#D1D5DB;
  --linea:rgba(255,255,255,.14);
  --apagado:rgba(255,255,255,.6);
  --beam:214,232,255;
  --display:"Syncopate",ui-sans-serif,system-ui,sans-serif;
  --texto:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --gut:clamp(1.6rem,4.4vw,4.5rem);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar{display:none}
body{
  background:var(--void); color:var(--chrome);
  font-family:var(--texto); -webkit-font-smoothing:antialiased;
  min-height:100svh;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}

/* La misma luz de ambiente del sitio, con las mismas medidas. */
#ambiente{
  position:fixed; inset:0; z-index:40; pointer-events:none;
  mix-blend-mode:screen;
  background:
    radial-gradient(92% 68% at 14% 10%, rgba(var(--beam),.055), transparent 72%),
    radial-gradient(86% 66% at 88% 84%, rgba(var(--beam),.05), transparent 70%),
    radial-gradient(150% 70% at 50% 114%, rgba(var(--beam),.055), transparent 64%);
}
@media (max-width:767px){
  #ambiente{ background:radial-gradient(160% 55% at 50% 112%, rgba(var(--beam),.06), transparent 66%) }
}

.rotulo{
  font-family:var(--texto); font-size:.58rem; font-weight:600;
  letter-spacing:.26em; text-transform:uppercase; color:var(--apagado);
}

/* ── barra ── */
.barra{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:1.1rem var(--gut);
  background:linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,.55));
  backdrop-filter:blur(16px) saturate(1.15);
  -webkit-backdrop-filter:blur(16px) saturate(1.15);
}
.barra .marca img{ height:clamp(1.7rem,2.6vw,2.3rem); width:auto }
.barra nav{ display:flex; gap:clamp(1rem,2.4vw,2.2rem) }
.barra nav a{
  font-size:.6rem; font-weight:400; letter-spacing:.24em;
  text-transform:uppercase; color:var(--gris);
  transition:color .35s var(--ease);
}
.barra nav a:hover{ color:var(--chrome) }

/* ── encabezado ── */
.tapa{ padding:clamp(2.6rem,7vh,4.5rem) var(--gut) clamp(1.4rem,3vh,2rem); text-align:center }
.tapa h1{
  font-family:var(--display); font-weight:700; text-transform:uppercase;
  font-size:clamp(1.1rem,3vw,1.9rem); letter-spacing:.06em;
  margin-top:clamp(.8rem,2vh,1.2rem);
}
.tapa p{
  margin:clamp(.9rem,2vh,1.3rem) auto 0; max-width:34rem;
  font-size:clamp(.88rem,1.15vw,.98rem); line-height:1.75; color:var(--apagado);
}

/* ── filtros ── */
.filtros{
  display:flex; flex-wrap:wrap; justify-content:center; gap:.45rem;
  padding:0 var(--gut) clamp(1.8rem,4vh,2.6rem);
}
.chip{
  appearance:none; cursor:pointer; font-family:inherit;
  border:1px solid var(--linea); border-radius:100px; background:transparent;
  color:var(--apagado); padding:.55em 1.15em;
  font-size:.56rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  transition:color .3s var(--ease), border-color .3s var(--ease), background .3s var(--ease);
}
.chip:hover{ color:var(--chrome); border-color:rgba(255,255,255,.4) }
.chip[aria-pressed="true"]{ background:var(--chrome); color:var(--void); border-color:var(--chrome) }

/* ── grilla ── */
.grilla{
  display:grid; gap:clamp(.8rem,1.6vw,1.4rem);
  grid-template-columns:repeat(auto-fill,minmax(min(20rem,100%),1fr));
  padding:0 var(--gut) clamp(4rem,10vh,7rem);
  max-width:88rem; margin:0 auto;
}
.auto{
  border:1px solid var(--linea); border-radius:3px; overflow:hidden;
  background:#08080a; display:flex; flex-direction:column;
  transition:border-color .4s var(--ease), transform .4s var(--ease);
}
.auto:hover{ border-color:rgba(255,255,255,.34); transform:translateY(-3px) }
.auto .lente{ aspect-ratio:16/10; overflow:hidden; background:#0b0b0d; position:relative }
.auto .lente img{ width:100%; height:100%; object-fit:cover; transition:transform .8s var(--ease) }
.auto:hover .lente img{ transform:scale(1.05) }
.auto .sinfoto{
  position:absolute; inset:0; display:grid; place-content:center;
  color:rgba(255,255,255,.18); font-size:.58rem; letter-spacing:.2em; text-transform:uppercase;
}
.auto .cuerpo{ padding:1.1rem 1.2rem 1.3rem; display:grid; gap:.45rem }
.auto h2{ font-size:1rem; font-weight:600; line-height:1.35 }
.auto .ficha{ font-size:.76rem; color:var(--apagado) }
.auto .precio{
  margin-top:.35rem; font-family:var(--display); font-size:.82rem;
  font-weight:700; letter-spacing:.04em;
}
.cinta{
  position:absolute; left:.7rem; top:.7rem; z-index:1;
  background:var(--chrome); color:var(--void);
  font-size:.48rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  padding:.35em .75em; border-radius:100px;
}

.vacio{ padding:5rem var(--gut); text-align:center; color:var(--apagado); grid-column:1/-1 }

/* ── detalle ── */
.detalle{
  position:fixed; inset:0; z-index:60; overflow:auto;
  background:rgba(0,0,0,.97); backdrop-filter:blur(10px);
  padding:clamp(1rem,4vw,3rem);
}
.detalle[hidden]{ display:none }
.detalle .caja{ max-width:74rem; margin:0 auto }
.detalle .arriba{ display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; margin-bottom:1.6rem }
.detalle h2{ font-family:var(--display); font-size:clamp(1rem,2.4vw,1.5rem); font-weight:700; text-transform:uppercase; letter-spacing:.05em }
.cerrar{
  appearance:none; border:1px solid var(--linea); border-radius:2px; background:transparent;
  color:var(--chrome); cursor:pointer; font-family:inherit;
  padding:.6em 1.1em; font-size:.56rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
}
.cerrar:hover{ border-color:rgba(255,255,255,.5) }
.galeria{ display:grid; gap:.6rem }
.galeria .grande{ aspect-ratio:16/10; overflow:hidden; border-radius:3px; background:#0b0b0d }
.galeria .grande img{ width:100%; height:100%; object-fit:cover }
.tiras{ display:flex; gap:.5rem; overflow-x:auto; padding-bottom:.3rem }
.tiras img{
  width:6.5rem; aspect-ratio:16/10; object-fit:cover; border-radius:2px;
  border:1px solid transparent; cursor:pointer; opacity:.5;
  transition:opacity .3s var(--ease), border-color .3s var(--ease); flex:0 0 auto;
}
.tiras img[aria-current="true"]{ opacity:1; border-color:var(--chrome) }
.datos{
  display:grid; gap:1rem 2rem; margin-top:1.8rem;
  grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));
}
.datos div span{ display:block }
.datos .valor{ font-size:.92rem; margin-top:.25rem }
.desc{ margin-top:1.8rem; max-width:44rem; line-height:1.8; color:var(--apagado); white-space:pre-line }
.consultar{
  display:inline-block; margin-top:2rem; padding:1em 2em;
  border:1px solid var(--chrome); border-radius:2px; background:var(--chrome); color:var(--void);
  font-family:var(--display); font-size:.6rem; font-weight:700;
  letter-spacing:.18em; text-transform:uppercase;
  transition:background .35s var(--ease), color .35s var(--ease);
}
.consultar:hover{ background:transparent; color:var(--chrome) }
</style>
</head>
<body>

<header class="barra">
  <a class="marca" href="/" aria-label="Manna Motors Selected — inicio">
    <img src="/assets/logo/logo-horizontal-blanco.svg" alt="Manna Motors Selected">
  </a>
  <nav>
    <a href="/">Inicio</a>
    <a href="/#estandar">Estándar</a>
    <a href="/#concierge">Contacto</a>
  </nav>
</header>

<section class="tapa">
  <span class="rotulo">El garage</span>
  <h1>Unidades seleccionadas</h1>
  <p>Cada auto que entra pasa por inspección, documentación y puesta a punto antes de aparecer acá.</p>
</section>

<div class="filtros" id="filtros"></div>
<div class="grilla" id="grilla"></div>

<div class="detalle" id="detalle" hidden></div>
<div id="ambiente" aria-hidden="true"></div>

<script src="/garage/garage.js"></script>
</body>
</html>
